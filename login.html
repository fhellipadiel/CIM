<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tela de Login e Cadastro — CIM</title>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <link rel="shortcut icon" type="image/webp" href="assets/logo.webp">
    <link rel="apple-touch-icon" href="assets/logo.webp">
    <link rel="preload" as="image" href="assets/logo.webp" fetchpriority="high" type="image/webp">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <!-- Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Tailwind config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#ffffff', darkbg: '#0a0a0a' }
                }
            }
        }
    </script>

    <style>
        /* Base */
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        /* Animações da galeria */
        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
        @keyframes scrollDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }
        .animate-scroll-up { animation: scrollUp 30s linear infinite; }
        .animate-scroll-down { animation: scrollDown 35s linear infinite; }

        /* Esconde scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fade-in */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .anim-fade-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
        .anim-fade-left { animation: fadeInLeft 0.6s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }

        /* Botões */
        .btn-glow {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.3s ease;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.12);
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.28),
                        0 0 0 6px rgba(255, 255, 255, 0.07);
        }
        .btn-glow:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.18);
        }

        /* Inputs */
        @keyframes inputGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.15); }
            50% { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08); }
        }
        .input-anim { transition: all 0.3s ease; }
        .input-anim:focus { animation: inputGlow 2s ease-in-out infinite; transform: translateY(-1px); }

        /* Shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .anim-shake { animation: shake 0.5s ease-in-out; }

        /* Bounce sucesso */
        @keyframes successBounce {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .anim-bounce { animation: successBounce 0.5s ease-out; }

        /* Botões soft */
        .btn-soft { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-soft:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.15); }
        .btn-soft:active { transform: translateY(0) scale(0.98); }

        /* Card select */
        .card-select { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-select:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 20px -5px rgba(255, 255, 255, 0.1); }
        .card-select:active { transform: translateY(-1px) scale(0.99); }

        /* Logo flutuante */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .anim-float { animation: floatLogo 4s ease-in-out infinite; }

        /* Seta botão */
        .btn-arrow i { transition: transform 0.3s ease; }
        .btn-arrow:hover i { transform: translateX(4px); }

        /* Transição forms */
        .form-transition {
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Olho senha */
        .eye-toggle { transition: all 0.2s ease; }
        .eye-toggle:hover { color: #ffffff; transform: scale(1.1); }

        /* Glow balls */
        @keyframes pulseBall {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.08); }
        }
        .glow-ball {
            position: absolute;
            bottom: -120px;
            left: calc(50% - 125px);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.08) 35%, rgba(255, 255, 255, 0.02) 60%, transparent 75%);
            border-radius: 50%;
            filter: blur(30px);
            pointer-events: none;
            animation: pulseBall 6s ease-in-out infinite;
            transition: left 1s cubic-bezier(0.65, 0, 0.35, 1);
            z-index: 1;
            will-change: left;
        }
        @media (min-width: 1024px) {
            .glow-ball {
                bottom: -180px;
                left: calc(50% - 250px);
                width: 500px;
                height: 500px;
                filter: blur(40px);
            }
        }
        .glow-ball.moved-left { left: -160px; }
        @media (min-width: 1024px) {
            .glow-ball.moved-left { left: -220px; }
        }

        .glow-ball-sm {
            position: absolute;
            bottom: -80px;
            left: calc(50% - 70px);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.15) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(22px);
            pointer-events: none;
            animation: pulseBall 5s ease-in-out infinite;
            transition: left 1s cubic-bezier(0.65, 0, 0.35, 1);
            z-index: 2;
            will-change: left;
        }
        @media (min-width: 1024px) {
            .glow-ball-sm {
                bottom: -120px;
                left: calc(50% - 140px);
                width: 280px;
                height: 280px;
                filter: blur(30px);
            }
        }
        .glow-ball-sm.moved-left { left: -80px; }
        @media (min-width: 1024px) {
            .glow-ball-sm.moved-left { left: -110px; }
        }

        /* Inputs mobile */
        @media screen and (max-width: 768px) {
            input[type="text"], input[type="password"], input[type="email"],
            input[type="number"], select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body class="h-full bg-darkbg text-white flex overflow-hidden font-sans relative">

    <!-- COLUNA ESQUERDA: FORMULÁRIOS -->
    <div class="w-full lg:w-[45%] h-full relative z-20 overflow-y-auto overflow-x-hidden no-scrollbar bg-gradient-to-r from-darkbg via-darkbg/95 to-transparent">

        <!-- Cabeçalho hero -->
        <div id="heroHeader" class="px-5 sm:px-8 lg:px-20 pt-10 pb-4">
            <div class="max-w-md mx-auto text-center lg:text-left lg:mx-0">
                <div class="flex justify-center lg:justify-start mb-4 anim-fade-left">
                    <img src="assets/logo.webp" alt="Logo" class="h-14 w-auto object-contain anim-float" onerror="this.style.display='none'">
                </div>
                <h1 class="text-4xl sm:text-5xl font-bold text-white tracking-tight leading-tight anim-fade-left delay-1">Conecte-se à CIM</h1>
                <p class="text-sm text-gray-400 mt-3 leading-relaxed anim-fade-left delay-2">
                    Acesse sua <strong class="text-white font-bold">conta</strong> e tenha tudo o que precisa para gerenciar seus <strong class="text-white font-bold">pedidos</strong>, peças e <strong class="text-white font-bold">informações</strong> em um só lugar.
                </p>
            </div>
        </div>

        <div class="px-5 sm:px-8 lg:px-20 pb-10 relative">
            <div class="w-full max-w-md mx-auto lg:mx-0 relative pt-2">

                <!-- Caixa de erro geral (topo) -->
                <div id="messageBox" class="hidden mb-6 p-4 rounded-2xl text-sm flex items-center gap-3 transition-all duration-150">
                    <i id="messageIcon" class="fa-solid fa-circle-info text-lg"></i>
                    <span id="messageText" class="font-medium"></span>
                </div>

                <!-- ================= FORM LOGIN ================= -->
                <form id="loginForm" class="space-y-5 form-transition" onsubmit="handleLogin(event)" novalidate>

                    <!-- Botão Google -->
                    <button type="button" onclick="handleGoogleLogin()"
                        class="w-full py-3 px-4 bg-white hover:bg-gray-100 text-black font-medium border border-transparent rounded-full shadow-sm btn-soft flex items-center justify-center gap-3 text-sm focus:outline-none focus:ring-2 focus:ring-white/50 anim-fade-up delay-3">
                        <svg class="w-4 h-4" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M23.745 12.27c-.07-.8-.64-1.55-1.42-1.74H12v4.57h6.61c-.3 1.58-1.57 2.82-3.25 3.3l3.69 2.86c2.16-1.99 3.69-4.94 3.69-8.99z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.69-2.86c-1.08.72-2.46 1.22-4.24 1.22-3.26 0-6.02-2.2-7-5.17H1.19v2.96C3.17 21.36 7.24 24 12 24z"/>
                            <path fill="#FBBC05" d="M5 14.28c-.25-.72-.39-1.5-.39-2.28s.14-1.56.39-2.28V6.76H1.19C.43 8.28 0 10.08 0 12s.43 3.72 1.19 5.24l3.81-2.96z"/>
                            <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.64 1.19 6.76l3.81 2.96c.98-2.97 3.74-5.17 7-5.17z"/>
                        </svg>
                        <span>Continuar com o Google</span>
                    </button>

                    <div class="flex items-center my-3 anim-fade-up delay-3">
                        <div class="flex-grow border-t border-white/10"></div>
                        <span class="px-3 text-xs text-gray-500 uppercase">ou</span>
                        <div class="flex-grow border-t border-white/10"></div>
                    </div>

                    <!-- Campo e-mail -->
                    <div class="space-y-1 anim-fade-up delay-4">
                        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-400">E-mail</label>
                        <input type="email" id="email" placeholder="E-MAIL"
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-full text-white text-sm focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/10 input-anim placeholder-gray-500">
                        <p id="emailError" class="hidden text-[11px] text-rose-400 mt-1 font-medium"></p>
                    </div>

                    <!-- Campo senha -->
                    <div class="space-y-1 anim-fade-up delay-5">
                        <div class="flex items-center justify-between">
                            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Senha</label>
                        </div>
                        <div class="relative">
                            <input type="password" id="password" placeholder="••••••••"
                                class="w-full pl-4 pr-12 py-3 bg-white/5 border border-white/10 rounded-full text-white text-sm focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/10 input-anim placeholder-gray-500">
                            <button type="button" onclick="togglePassword('password', this)" class="eye-toggle absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500" tabindex="-1" aria-label="Mostrar senha">
                                <i class="fa-regular fa-eye text-base"></i>
                            </button>
                        </div>
                        <p id="passwordError" class="hidden text-[11px] text-rose-400 mt-1 font-medium"></p>
                    </div>

                    <p class="text-[11px] text-gray-500 leading-relaxed text-center lg:text-left anim-fade-up delay-5">
                        Ao continuar, você concorda com a
                        <a href="#" onclick="event.preventDefault()" class="text-gray-300 underline hover:text-white transition-colors">Política de Privacidade e os Termos</a>
                        de Serviço da CIM.
                    </p>

                    <!-- Botão Entrar -->
                    <button type="submit" id="submitBtn"
                        class="w-full mt-2 py-3 px-4 bg-white hover:bg-gray-100 text-black font-semibold rounded-full shadow-md btn-glow btn-arrow flex items-center justify-center gap-2 text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white focus:ring-offset-darkbg anim-fade-up delay-6">
                        <span>Entrar</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>

                    <p class="text-center text-xs text-gray-400 pt-3 anim-fade-up delay-6">
                        Não tem uma conta?
                        <a href="#" onclick="switchView('register')" class="text-white font-semibold hover:underline transition-all hover:tracking-wide">Cadastre-se</a>
                    </p>
                </form>

                <!-- ================= FORM CADASTRO ================= -->
                <form id="registerForm" class="hidden space-y-4 form-transition" onsubmit="handleRegister(event)">

                    <div class="flex items-center justify-between pb-1">
                        <h2 class="text-base font-bold text-white">Criar Conta</h2>
                        <button type="button" onclick="handleRegisterBack()" class="text-xs text-gray-400 hover:text-white font-medium transition-all hover:-translate-x-1">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Voltar
                        </button>
                    </div>

                    <!-- Google -->
                    <button type="button" onclick="handleGoogleLogin()"
                        class="w-full py-3 px-4 bg-white hover:bg-gray-100 text-black font-medium border border-transparent rounded-full shadow-sm btn-soft flex items-center justify-center gap-3 text-sm focus:outline-none focus:ring-2 focus:ring-white/50">
                        <svg class="w-4 h-4" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M23.745 12.27c-.07-.8-.64-1.55-1.42-1.74H12v4.57h6.61c-.3 1.58-1.57 2.82-3.25 3.3l3.69 2.86c2.16-1.99 3.69-4.94 3.69-8.99z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.69-2.86c-1.08.72-2.46 1.22-4.24 1.22-3.26 0-6.02-2.2-7-5.17H1.19v2.96C3.17 21.36 7.24 24 12 24z"/>
                            <path fill="#FBBC05" d="M5 14.28c-.25-.72-.39-1.5-.39-2.28s.14-1.56.39-2.28V6.76H1.19C.43 8.28 0 10.08 0 12s.43 3.72 1.19 5.24l3.81-2.96z"/>
                            <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.64 1.19 6.76l3.81 2.96c.98-2.97 3.74-5.17 7-5.17z"/>
                        </svg>
                        <span>Cadastrar com o Google</span>
                    </button>

                    <div class="flex items-center my-2">
                        <div class="flex-grow border-t border-white/10"></div>
                        <span class="px-3 text-xs text-gray-500 uppercase">ou</span>
                        <div class="flex-grow border-t border-white/10"></div>
                    </div>

                    <!-- Tipo de pessoa -->
                    <div id="personTypeContainer" class="space-y-1">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Selecione o Tipo de Cadastro</label>
                        <div id="personTypeGrid" class="grid grid-cols-2 gap-3">
                            <button type="button" id="btnFisica" onclick="setPersonType('fisica')"
                                class="card-select py-3 px-3 border border-white/10 rounded-2xl text-xs font-semibold flex flex-col items-center justify-center gap-2 bg-white/5 text-gray-300 hover:bg-white/10 hover:border-white/30">
                                <i class="fa-solid fa-user text-base"></i> Pessoa Física
                            </button>
                            <button type="button" id="btnJuridica" onclick="setPersonType('juridica')"
                                class="card-select py-3 px-3 border border-white/10 rounded-2xl text-xs font-semibold flex flex-col items-center justify-center gap-2 bg-white/5 text-gray-300 hover:bg-white/10 hover:border-white/30">
                                <i class="fa-solid fa-building text-base"></i> Jurídica
                            </button>
                        </div>
                    </div>

                    <!-- Campos cadastro -->
                    <div id="registerFieldsContainer" class="hidden opacity-0 transform translate-y-2 transition-all duration-300 ease-in-out border-t border-white/10 pt-3 space-y-3 pr-1">

                        <!-- Documento (CPF/CNPJ) -->
                        <div class="space-y-1">
                            <label for="regDoc" id="labelDoc" class="block text-xs font-semibold uppercase tracking-wider text-gray-400">CPF</label>
                            <div class="relative">
                                <input type="text" id="regDoc" placeholder="000.000.000-00" maxlength="20" oninput="formatDocument(this)"
                                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-full text-white text-sm focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/10 input-anim placeholder-gray-500">
                                <div id="docLoading" class="absolute right-4 top-3.5 hidden">
                                    <i class="fa-solid fa-spinner animate-spin text-gray-400 text-sm"></i>
                                </div>
                            </div>
                            <p id="docApiFeedback" class="text-[11px] text-gray-400 hidden mt-1 font-medium"></p>
                        </div>

                        <!-- Nome -->
                        <div class="space-y-1">
                            <label for="regName" id="labelName" class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Nome Completo</label>
                            <input type="text" id="regName" placeholder="Seu nome completo"
                                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-full text-white text-sm focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/10 input-anim placeholder-gray-500">
                        </div>

                        <!-- Telefone -->
                        <div class="space-y-1">
                            <label for="regPhone" class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Telefone / Celular</label>
                            <input type="text" id="regPhone" placeholder="(00) 00000-0000" maxlength="15" oninput="formatPhone(this)"
                                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-full text-white text-sm focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/10 input-anim placeholder-gray-500">
                        </div>

                        <!-- CEP -->
                        <div id="cepContainer" class="space-y-1">
                            <label for="regCep" class="block text-xs font-semibold uppercase tracking-wider text-gray-400">CEP</label>
                            <div class="relative">
                                <input type="text" id="regCep" placeholder="00000-000" maxlength="9" oninput="formatCep(this)"
                                    class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-full text-white text-sm focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/10 input-anim placeholder-gray-500">
                                <div id="cepLoading" class="absolute right-4 top-3.5 hidden">
                                    <i class="fa-solid fa-spinner animate-spin text-gray-400 text-sm"></i>
                                </div>
                            </div>
                            <p id="cepApiFeedback" class="text-[11px] text-gray-400 hidden mt-1 font-medium"></p>
                        </div>

                        <!-- Endereço extra -->
                        <div id="addressExtraFields" class="space-y-3 pt-1 border-t border-dashed border-white/10">
                            <div id="juridicaExtraHeader" class="hidden">
                                <div class="grid grid-cols-2 gap-2 mb-2">
                                    <div class="space-y-1">
                                        <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Nome Fantasia</label>
                                        <input type="text" id="regFantasia" readonly placeholder="Automático via CNPJ"
                                            class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-full text-gray-400 text-xs focus:outline-none cursor-not-allowed">
                                    </div>
                                    <div class="space-y-1">
                                        <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Situação</label>
                                        <input type="text" id="regSituacao" readonly placeholder="Ativa"
                                            class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-full text-gray-400 text-xs focus:outline-none cursor-not-allowed">
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-2">
                                <div class="col-span-2 space-y-1">
                                    <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Logradouro / Endereço</label>
                                    <input type="text" id="regLogradouro" readonly placeholder="Preenchido via CEP/CNPJ"
                                        class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-full text-gray-400 text-xs focus:outline-none cursor-not-allowed">
                                </div>
                                <div class="space-y-1">
                                    <div class="flex items-center justify-between">
                                        <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Número</label>
                                        <label class="flex items-center gap-1 text-[9px] text-gray-400 cursor-pointer">
                                            <input type="checkbox" id="noNumberCheckbox" onchange="toggleNoNumber(this)" class="rounded bg-white/5 border-white/10 text-black focus:ring-0"> S/N
                                        </label>
                                    </div>
                                    <input type="text" id="regNumero" placeholder="Nº"

        /* ============================================================
           3. COOLDOWN SILENCIOSO (login e doc)
           Regras: 3 tentativas erradas = 3 min bloqueado.
           Nunca mostra contador nem tempo ao usuário.
           ============================================================ */
        const COOLDOWN_ATTEMPTS = 3;
        const COOLDOWN_MS = 3 * 60 * 1000;
        const COOLDOWN_KEY = 'cim_cooldowns';

        // Lê cooldowns salvos
        function loadCooldowns() {
            try { return JSON.parse(localStorage.getItem(COOLDOWN_KEY)) || {}; }
            catch (e) { return {}; }
        }

        // Salva cooldowns
        function saveCooldowns(data) {
            try { localStorage.setItem(COOLDOWN_KEY, JSON.stringify(data)); } catch (e) {}
        }

        let cooldowns = loadCooldowns();

        // Verifica se está bloqueado
        function isBlocked(key) {
            const cd = cooldowns[key];
            if (!cd || !cd.blockedUntil) return false;
            return Date.now() < cd.blockedUntil;
        }

        // Registra tentativa errada
        function registerError(key) {
            const cd = cooldowns[key] || { attempts: 0, blockedUntil: 0 };
            cd.attempts = (cd.attempts || 0) + 1;

            if (cd.attempts >= COOLDOWN_ATTEMPTS) {
                cd.blockedUntil = Date.now() + COOLDOWN_MS;
                cd.attempts = 0;
            }
            cooldowns[key] = cd;
            saveCooldowns(cooldowns);
            return isBlocked(key);
        }

        // Limpa cooldown (após sucesso)
        function registerSuccess(key) {
            if (cooldowns[key]) {
                delete cooldowns[key];
                saveCooldowns(cooldowns);
            }
        }

        // Limpa cooldowns expirados ao carregar
        function cleanExpiredCooldowns() {
            let dirty = false;
            for (const key of Object.keys(cooldowns)) {
                const cd = cooldowns[key];
                if (cd.blockedUntil && Date.now() >= cd.blockedUntil) {
                    delete cooldowns[key];
                    dirty = true;
                }
            }
            if (dirty) saveCooldowns(cooldowns);
        }

        /* ============================================================

        // Máscara CPF/CNPJ
        function formatDocument(input) {
            let value = input.value.replace(/\D/g, '');

            if (currentPersonType === 'fisica') {
                if (value.length > 11) value = value.slice(0, 11);
                if (value.length > 9) value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
                else if (value.length > 6) value = value.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
                else if (value.length > 3) value = value.replace(/^(\d{3})(\d{0,3}).*/, '$1.$2');
                input.value = value;
                if (value.replace(/\D/g, '').length === 11) verifyCpfData(value.replace(/\D/g, ''));
            } else {
                if (value.length > 14) value = value.slice(0, 14);
                if (value.length > 12) value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2}).*/, '$1.$2.$3/$4-$5');
                else if (value.length > 8) value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4}).*/, '$1.$2.$3/$4');
                else if (value.length > 5) value = value.replace(/^(\d{2})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
                else if (value.length > 2) value = value.replace(/^(\d{2})(\d{0,3}).*/, '$1.$2');
                input.value = value;
                if (value.replace(/\D/g, '').length === 14) fetchCnpjData(value.replace(/\D/g, ''));
            }
        }

        // Máscara CEP
        function formatCep(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 8) value = value.slice(0, 8);
            if (value.length > 5) value = value.replace(/^(\d{5})(\d{0,3}).*/, '$1-$2');
            input.value = value;
            if (value.replace(/\D/g, '').length === 8) fetchCepData(value.replace(/\D/g, ''));
        }

        // Máscara telefone
        function formatPhone(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 10) value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            else if (value.length > 6) value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            else if (value.length > 2) value = value.replace(/^(\d{2})(\d{0,5}).*/, '($1) $2');
            else if (value.length > 0) value = value.replace(/^(\d{0,2}).*/, '($1');
            input.value = value;
        }

        // Valida CPF
        function validateCpfAlgorithm(strCPF) {
            let sum = 0, remainder;
            if (strCPF === "00000000000" || strCPF.length !== 11) return false;
            for (let i = 1; i <= 9; i++) sum += parseInt(strCPF.substring(i - 1, i)) * (11 - i);
            remainder = (sum * 10) % 11;
            if (remainder === 10 || remainder === 11) remainder = 0;
            if (remainder !== parseInt(strCPF.substring(9, 10))) return false;
            sum = 0;
            for (let i = 1; i <= 10; i++) sum += parseInt(strCPF.substring(i - 1, i)) * (12 - i);
            remainder = (sum * 10) % 11;
            if (remainder === 10 || remainder === 11) remainder = 0;
            if (remainder !== parseInt(strCPF.substring(10, 11))) return false;
            return true;
        }

        // Valida CNPJ
        function validateCnpjAlgorithm(cnpj) {
            cnpj = cnpj.replace(/\D/g, '');
            if (cnpj.length !== 14) return false;
            if (/^(\d)\1+$/.test(cnpj)) return false;

            const calc = (base) => {
                let sum = 0, pos = base.length - 7;
                for (let i = base.length; i >= 1; i--) {
                    sum += parseInt(base.charAt(base.length - i)) * pos--;
                    if (pos < 2) pos = 9;
                }
                const result = sum % 11;
                return result < 2 ? 0 : 11 - result;
            };

            const base = cnpj.substring(0, 12);
            const d1 = calc(base);
            const d2 = calc(base + d1);
            return cnpj === base + d1.toString() + d2.toString();
        }

        /* ============================================================
           8. VALIDAÇÃO CPF (com cooldown silencioso)
           ============================================================ */
        async function verifyCpfData(cpf) {
            const loadingIndicator = document.getElementById('docLoading');
            const feedback = document.getElementById('docApiFeedback');
            const KEY = 'cpf';

            // Se bloqueado, mostra erro comum sem detalhes
            if (isBlocked(KEY)) {
                feedback.textContent = 'CPF inválido.';
                feedback.className = 'text-[11px] text-rose-400 mt-1 font-medium block anim-shake';
                return;
            }

            loadingIndicator.classList.remove('hidden');
            feedback.classList.add('hidden');

            try {
                if (validateCpfAlgorithm(cpf)) {
                    registerSuccess(KEY);
                    feedback.textContent = 'CPF válido.';
                    feedback.className = 'text-[11px] text-emerald-400 mt-1 font-medium block anim-bounce';
                } else {
                    registerError(KEY);
                    feedback.textContent = 'CPF inválido.';
                    feedback.className = 'text-[11px] text-rose-400 mt-1 font-medium block anim-shake';
                }
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        /* ============================================================
           9. CONSULTA CNPJ (com cooldown silencioso)
           ============================================================ */
        async function fetchCnpjData(cnpj) {
            const loadingIndicator = document.getElementById('docLoading');
            const feedback = document.getElementById('docApiFeedback');
            const KEY = 'cnpj';

            if (isBlocked(KEY)) {
                feedback.textContent = 'CNPJ inválido.';
                feedback.className = 'text-[11px] text-rose-400 mt-1 font-medium block anim-shake';
                return;
            }

            loadingIndicator.classList.remove('hidden');
            feedback.classList.add('hidden');
            feedback.textContent = '';

            ['regName', 'regFantasia', 'regSituacao', 'regLogradouro',
             'regNumero', 'regBairro', 'regMunicipio', 'regUf'].forEach(id => {
                document.getElementById(id).value = '';
            });

            // Validação local primeiro
            if (!validateCnpjAlgorithm(cnpj)) {
                loadingIndicator.classList.add('hidden');
                registerError(KEY);
                feedback.textContent = 'CNPJ inválido.';
                feedback.className = 'text-[11px] text-rose-400 mt-1 font-medium block anim-shake';
                return;
            }

            // Preenche campos
            const fillFields = (d) => {
                document.getElementById('regName').value = d.razao_social || d.nome || '';
                document.getElementById('regFantasia').value = d.nome_fantasia || d.fantasia || d.razao_social || '';
                document.getElementById('regSituacao').value = d.descricao_situacao_cadastral || d.situacao || 'Ativa';
                document.getElementById('regLogradouro').value = d.logradouro || d.street || '';
                document.getElementById('regNumero').value = d.numero || '';
                document.getElementById('regBairro').value = d.bairro || d.neighborhood || '';
                document.getElementById('regMunicipio').value = d.municipio || d.city || '';
                document.getElementById('regUf').value = d.uf || d.state || '';
                if (d.cep) document.getElementById('regCep').value = String(d.cep).replace(/\D/g, '');

                const emailField = document.getElementById('regEmail');
                if (d.email && !emailField.value) emailField.value = String(d.email).toLowerCase();
            };

            try {
                let data = null;

                // Tenta BrasilAPI
                try {
                    const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
                    if (response.ok) {
                        data = await response.json();
                    } else if (response.status === 404) {
                        throw new Error('__NOT_FOUND__');
                    } else {
                        throw new Error('API indisponível');
                    }
                } catch (err) {
                    console.warn('[CNPJ] BrasilAPI falhou:', err.message);

                    if (err.message === '__NOT_FOUND__') {
                        loadingIndicator.classList.add('hidden');
                        registerError(KEY);
                        feedback.textContent = 'CNPJ não encontrado.';
                        feedback.className = 'text-[11px] text-rose-400 mt-1 font-medium block anim-shake';
                        return;
                    }

                    // Fallback ReceitaWS
                    const fb = await fetch(`https://receitaws.com.br/v1/cnpj/${cnpj}`);
                    if (!fb.ok) throw new Error('Serviço indisponível');
                    const raw = await fb.json();

                    if (raw.status === 'ERROR') {
                        loadingIndicator.classList.add('hidden');
                        registerError(KEY);
                        feedback.textContent = 'CNPJ não encontrado.';
                        feedback.className = 'text-[11px] text-rose-400 mt-1 font-medium block anim-shake';
                        return;
                    }

                    data = {
                        razao_social: raw.nome,
                        nome_fantasia: raw.fantasia,
                        descricao_situacao_cadastral: raw.situacao,
                        logradouro: raw.logradouro,
                        numero: raw.numero,
                        bairro: raw.bairro,
                        municipio: raw.municipio,
                        uf: raw.uf,
                        email: raw.email,
                        cep: raw.cep,
                    };
                }

                if (!data) throw new Error('Resposta vazia');

                registerSuccess(KEY);
                fillFields(data);
                feedback.textContent = 'CNPJ verificado com sucesso.';
                feedback.className = 'text-[11px] text-emerald-400 mt-1 font-medium block anim-bounce';

            } catch (error) {
                console.error('[CNPJ] Erro:', error);
                feedback.textContent = 'Não foi possível consultar o CNPJ agora.';
                feedback.className = 'text-[11px] text-amber-400 mt-1 font-medium block';
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        /* ============================================================
           10. CONSULTA CEP
           ============================================================ */
        async function fetchCepData(cep) {
            const loadingIndicator = document.getElementById('cepLoading');
            const feedback = document.getElementById('cepApiFeedback');
            loadingIndicator.classList.remove('hidden');
            feedback.classList.add('hidden');

            try {
                const response = await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`);
                if (!response.ok) throw new Error('CEP não encontrado');
                const data = await response.json();

                document.getElementById('regLogradouro').value = data.street || '';
                document.getElementById('regBairro').value = data.neighborhood || '';
                document.getElementById('regMunicipio').value = data.city || '';
                document.getElementById('regUf').value = data.state || '';

                feedback.textContent = 'Endereço preenchido via CEP.';
                feedback.className = 'text-[11px] text-emerald-400 mt-1 font-medium block anim-bounce';
            } catch (error) {
                feedback.textContent = 'CEP não encontrado.';
                feedback.className = 'text-[11px] text-rose-400 mt-1 font-medium block anim-shake';
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        /* ============================================================
           11. CHECKBOXES ENDEREÇO
           ============================================================ */
        function toggleNoNumber(checkbox) {
            const numInput = document.getElementById('regNumero');
            if (checkbox.checked) {
                numInput.value = 'S/N';
                numInput.disabled = true;
                numInput.classList.add('bg-white/5', 'cursor-not-allowed');
            } else {
                numInput.value = '';
                numInput.disabled = false;
                numInput.classList.remove('bg-white/5', 'cursor-not-allowed');
            }
        }

        function toggleNoComplement(checkbox) {
            const compInput = document.getElementById('regComplemento');
            if (checkbox.checked) {
                compInput.value = 'Nenhum';
                compInput.disabled = true;
                compInput.classList.add('bg-white/5', 'cursor-not-allowed');
            } else {
                compInput.value = '';
                compInput.disabled = false;
                compInput.classList.remove('bg-white/5', 'cursor-not-allowed');
            }
        }

        /* ============================================================
           12. SALVAR DADOS NO FIREBASE
           ============================================================ */
        async function salvarDadosUsuario(uid, extraData = {}) {
            if (!database) return;

            const dados = {
                email: document.getElementById('regEmail').value.trim(),
                userType: currentPersonType === 'fisica' ? 'PF' : 'PJ',
                telefone: document.getElementById('regPhone').value.replace(/\D/g, ''),
                createdAt: Date.now(),
                lastAccess: Date.now(),
                photoURL: DEFAULT_USER_AVATAR,
                mustChangePassword: false,
                ...extraData
            };

            if (currentPersonType === 'fisica') {
                dados.name = document.getElementById('regName').value.trim();
                dados.cpf = document.getElementById('regDoc').value.replace(/\D/g, '');
                dados.cep = document.getElementById('regCep').value.replace(/\D/g, '');
                dados.logradouro = document.getElementById('regLogradouro').value;
                dados.numero = document.getElementById('regNumero').value;
                dados.complemento = document.getElementById('regComplemento').value || '';
                dados.bairro = document.getElementById('regBairro').value;
                dados.cidade = document.getElementById('regMunicipio').value;
                dados.uf = document.getElementById('regUf').value;
            } else {
                dados.cnpj = document.getElementById('regDoc').value.replace(/\D/g, '');
                dados.inscricao_estadual = '';
                dados.name = document.getElementById('regName').value.trim();
                dados.cep = document.getElementById('regCep').value.replace(/\D/g, '');
                dados.logradouro = document.getElementById('regLogradouro').value;
                dados.numero = document.getElementById('regNumero').value;
                dados.complemento = document.getElementById('regComplemento').value || '';
                dados.bairro = document.getElementById('regBairro').value;
                dados.cidade = document.getElementById('regMunicipio').value;
                dados.uf = document.getElementById('regUf').value;
                dados.nome_fantasia = document.getElementById('regFantasia').value || '';
                dados.situacao_cadastral = document.getElementById('regSituacao').value || '';
            }

            await database.ref(`users/${uid}`).update(dados);
        }

        /* ============================================================
           13. LOGIN
           ============================================================ */
        async function handleLogin(event) {
            event.preventDefault();

            // Limpa erros visuais dos campos
            clearFieldError('emailError');
            clearFieldError('passwordError');
            hideMessage();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // Validação de campos vazios
            let hasEmpty = false;
            if (!email && !password) {
                setFieldError('emailError', 'Preencha o e-mail e a senha.');
                hasEmpty = true;
            } else if (!email) {
                setFieldError('emailError', 'Preencha o e-mail.');
                hasEmpty = true;
            } else if (!password) {
                setFieldError('passwordError', 'Preencha a senha.');
                hasEmpty = true;
            }
            if (hasEmpty) return;

            // Se estiver bloqueado, mostra mensagem genérica e para
            const KEY = 'login';
            if (isBlocked(KEY)) {
                showMessage('Volte mais tarde para tentar.');
                return;
            }

            if (!auth) {
                showMessage('Aguarde alguns segundos e tente novamente.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-sm"></i><span>Entrando...</span>';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                registerSuccess(KEY);
                window.location.href = 'cim.html';
            } catch (error) {
                console.error('[Login] Erro Firebase:', error);

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Entrar</span><i class="fa-solid fa-arrow-right text-xs"></i>';

                // Registra erro no cooldown silencioso
                const blocked = registerError(KEY);

                if (blocked) {
                    // Atingiu 3 tentativas → bloqueado
                    showMessage('Volte mais tarde para tentar.');
                } else {
                    // Ainda não bloqueado → mensagem genérica
                    showMessage('E-mail ou senha incorretos.');
                }
            }
        }

        /* ============================================================
           14. CADASTRO
           ============================================================ */
        async function handleRegister(event) {
            event.preventDefault();

            if (!auth || !database) {
                showMessage('Aguarde alguns segundos e tente novamente.');
                return;
            }

            // Cadastro via Google
            if (modoGoogleCadastro && usuarioGoogle) {
                const name = document.getElementById('regName').value.trim();
                const doc = document.getElementById('regDoc').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const email = document.getElementById('regEmail').value.trim() || usuarioGoogle.email;

                if (!currentPersonType) {
                    showMessage('Selecione o tipo de pessoa (Física ou Jurídica).');
                    return;
                }
                if (!name || !doc || !phone || !email) {
                    showMessage('Preencha todos os campos obrigatórios.');
                    return;
                }

                const registerBtn = document.getElementById('registerBtn');
                hideMessage();
                registerBtn.disabled = true;
                registerBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-sm"></i><span>Salvando...</span>';

                try {
                    await salvarDadosUsuario(usuarioGoogle.uid, {
                        name: name,
                        email: email,
                        photoURL: usuarioGoogle.photoURL || DEFAULT_USER_AVATAR
                    });
                    registerSuccess('cnpj');
                    registerSuccess('cpf');
                    registerSuccess('login');
                    window.location.href = 'cim.html';
                } catch (err) {
                    console.error('[Registro Google] Erro:', err);
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<span>Finalizar Cadastro</span><i class="fa-solid fa-arrow-right text-xs"></i>';
                    showMessage('Erro ao salvar dados. Tente novamente.');
                }
                return;
            }

            // Cadastro tradicional
            const name = document.getElementById('regName').value.trim();
            const doc = document.getElementById('regDoc').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const registerBtn = document.getElementById('registerBtn');

            if (!currentPersonType) {
                showMessage('Selecione o tipo de pessoa (Física ou Jurídica).');
                return;
            }
            if (!name || !doc || !phone || !email || password.length < 6) {
                showMessage('Preencha todos os campos obrigatórios. Senha deve ter pelo menos 6 caracteres.');
                return;
            }

            hideMessage();
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-sm"></i><span>Cadastrando...</span>';

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);

                try {
                    await userCredential.user.updateProfile({ displayName: name });
                } catch (e) { console.warn('Não foi possível atualizar displayName:', e); }

                await salvarDadosUsuario(userCredential.user.uid);

                registerSuccess('cnpj');
                registerSuccess('cpf');
                registerSuccess('login');

                window.location.href = 'cim.html';
            } catch (error) {
                console.error('[Cadastro] Erro Firebase:', error);
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<span>Finalizar Cadastro</span><i class="fa-solid fa-arrow-right text-xs"></i>';

                let msgUser = 'Erro ao criar conta. Tente novamente.';
                if (error.code === 'auth/email-already-in-use') msgUser = 'Este e-mail já está cadastrado.';
                else if (error.code === 'auth/invalid-email') msgUser = 'E-mail inválido.';
                else if (error.code === 'auth/weak-password') msgUser = 'Senha muito fraca. Use pelo menos 6 caracteres.';
                else if (error.code === 'auth/network-request-failed') msgUser = 'Falha de conexão. Verifique sua internet.';

                showMessage(msgUser);
            }
        }

        /* ============================================================
           15. LOGIN COM GOOGLE
           ============================================================ */
        async function handleGoogleLogin() {
            if (!auth || !database) {
                showMessage('Aguarde alguns segundos e tente novamente.');
                return;
            }

            const provider = new firebase.auth.GoogleAuthProvider();

            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                const snapshot = await database.ref(`users/${user.uid}`).once('value');
                if (snapshot.exists()) {
                    registerSuccess('login');
                    window.location.href = 'cim.html';
                } else {
                    // Novo usuário via Google → completa cadastro
                    modoGoogleCadastro = true;
                    usuarioGoogle = user;

                    document.getElementById('senhaContainer').style.display = 'none';
                    document.getElementById('regPassword').required = false;

                    switchView('register');

                    setTimeout(() => {
                        document.getElementById('regEmail').value = user.email || '';
                        document.getElementById('regName').value = user.displayName || '';
                    }, 450);
                }
            } catch (error) {
                console.error('[Google] Erro:', error);
                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('Janela de autenticação fechada. Tente novamente.');
                } else if (error.code === 'auth/popup-blocked') {
                    showMessage('Permita pop-ups para usar o login com Google.');
                } else if (error.code === 'auth/cancelled-popup-request') {
                    // silencioso
                } else {
                    showMessage('Erro ao autenticar com Google. Tente novamente.');
                }
            }
        }

        /* ============================================================
           16. GALERIA DINÂMICA DO LOGIN
           ============================================================ */
        const GALLERY_DEFAULT_IMAGES = [
            'https://picsum.photos/seed/1/600/600',
            'https://picsum.photos/seed/2/600/600',
            'https://picsum.photos/seed/3/600/600',
            'https://picsum.photos/seed/4/600/600',
            'https://picsum.photos/seed/5/600/600',
            'https://picsum.photos/seed/6/600/600'
        ];

        // Converte valor Firebase em array
        function parseGalleryArray(val) {
            if (!val) return [];
            if (Array.isArray(val)) return val.filter(Boolean);
            return Object.keys(val).sort((a, b) => Number(a) - Number(b)).map(k => val[k]).filter(Boolean);
        }

        // Escapa atributos HTML
        function escapeAttr(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Monta galeria
        async function buildLoginGallery() {
            const container = document.getElementById('loginGalleryContainer');
            if (!container) return;

            let images = [];

            try {
                if (database) {
                    const [gallerySnap, productsSnap] = await Promise.all([
                        database.ref('loginGallery').once('value'),
                        database.ref('products').once('value')
                    ]);

                    const ids = parseGalleryArray(gallerySnap.val());
                    const products = productsSnap.val() || {};

                    images = ids
                        .map(id => {
                            const p = products[id];
                            return p && p.image ? p.image : null;
                        })
                        .filter(url => url && typeof url === 'string' && url.trim() !== '');
                }
            } catch (err) {
                console.warn('[Galeria] Falha ao carregar do Firebase:', err);
            }

            if (images.length === 0) {
                images = [...GALLERY_DEFAULT_IMAGES];
            }

            const MIN_UNIQUE = 4;
            const uniqueCount = Math.max(MIN_UNIQUE, images.length);
            const itemsPerColumn = uniqueCount * 2;

            const columns = [
                { anim: 'scroll-up', offset: 0, mt: '' },
                { anim: 'scroll-down', offset: Math.floor(images.length / 3), mt: 'mt-32' },
                { anim: 'scroll-up', offset: Math.floor(images.length * 2 / 3), mt: 'mt-16' }
            ];

            container.innerHTML = columns.map(col => {
                let items = '';
                for (let i = 0; i < itemsPerColumn; i++) {
                    const idx = (i + col.offset) % images.length;
                    const url = escapeAttr(images[idx]);
                    items += `<img src="${url}" class="w-full aspect-square object-cover rounded-none border border-white/5 shadow-2xl" alt="" loading="lazy">`;
                }
                const mtClass = col.mt ? ` ${col.mt}` : '';
                return `<div class="flex flex-col gap-[2px] animate-${col.anim} w-72${mtClass}">${items}</div>`;
            }).join('');
        }

        /* ============================================================
           17. INICIALIZAÇÃO
           ============================================================ */
        document.addEventListener('DOMContentLoaded', () => {
            // Limpa cooldowns expirados
            cleanExpiredCooldowns();

            // Limpa erro de campo ao digitar
            document.getElementById('email').addEventListener('input', () => clearFieldError('emailError'));
            document.getElementById('password').addEventListener('input', () => clearFieldError('passwordError'));

            // Inicializa Firebase
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                database = firebase.database();

                // Redireciona se já logado
                auth.onAuthStateChanged(user => {
                    if (user) {
                        database.ref(`users/${user.uid}`).once('value').then(snapshot => {
                            if (snapshot.exists()) {
                                window.location.href = 'cim.html';
                            }
                        });
                    }
                });

                buildLoginGallery();
            }
        });
    </script>
