<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CIM Global Parts</title>
  <link rel="icon" href="assets/logo.webp" type="image/webp">
  <!-- ESTILOS: página de captura independente dos arquivos assets -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:#000;--text:#f1f3f5;--muted:#9298a4;--line:#282b32;--accent:#ff3601}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 115%,rgba(255,255,255,.16) 0%,rgba(255,255,255,.045) 38%,transparent 70%),#000;background-attachment:fixed;color:var(--text);font-family:Inter,Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:40px 20px}
main{width:100%;max-width:480px;background:transparent;border:0;border-radius:24px;padding:36px;box-shadow:none}
.capture-header{text-align:center;margin-bottom:28px}
.page-logo{position:absolute;top:24px;left:28px;display:block;width:58px;height:58px;object-fit:contain}
.capture-mark{display:block;width:72px;height:72px;object-fit:contain;margin:0 auto 18px}
#photo{display:block;width:76px;height:76px;object-fit:cover;border-radius:22px;margin:0 auto 18px}
h1,h2{font-family:'Space Grotesk',Arial,sans-serif;letter-spacing:-.6px;margin:0 0 10px}
h1{font-size:26px;line-height:1.2}
.capture-field{margin:0 0 20px}
.capture-field label{display:block;font-size:12px;font-weight:600;margin-bottom:9px}
.capture-field input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:11px;background:#000;color:var(--text);font:14px Inter,Arial,sans-serif;transition:border-color .2s,box-shadow .2s}
.capture-field input::placeholder{color:#626875}
.capture-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #ff360112}
.capture-field input[aria-invalid=true]{border-color:#f57676}
.field-error{display:block;font-size:11px;line-height:1.5;color:#f88;margin-top:6px}
.field-error:empty{display:none}
.capture-permission{border-top:1px solid var(--line);padding-top:20px;margin-top:6px}
.capture-permission label{display:flex;gap:10px;align-items:flex-start;font-size:11px;line-height:1.8;color:var(--muted);cursor:pointer}
.capture-permission input{flex-shrink:0;margin:4px 0 0;width:16px;height:16px;accent-color:var(--accent)}
button{width:100%;padding:15px 18px;border:0;border-radius:11px;background:var(--accent);color:#160a04;font:600 13px Inter,Arial,sans-serif;cursor:pointer;margin-top:22px;display:flex;align-items:center;justify-content:space-between}
button:hover{background:#e63000}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible{outline:2px solid white;outline-offset:4px}
.capture-loading,.capture-message{color:var(--muted);font-size:13px;line-height:1.7;text-align:center}
.capture-message:empty{display:none}
.unavailable-page .page-logo{position:static;width:76px;height:76px;margin:0 auto 24px}
.unavailable-page .capture-header{margin-bottom:12px}
.unavailable-page .capture-message{margin:0;color:var(--muted)}
.capture-message.error{padding:14px;background:#f8717110;border:1px solid #f8717125;border-radius:10px;color:#f99}
#success{text-align:center;padding:8px 0}
#success p{font-size:13px;color:var(--muted);line-height:1.7}
.success-icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:#3ecf8e15;color:#3ecf8e;font-size:30px}
#another{justify-content:center}
#send{border-radius:999px}
#officialSite{display:inline-block;width:auto;padding:0;margin:6px 0 0;background:none;border:0;border-radius:0;color:var(--accent);font-size:12px;font-weight:500;text-decoration:none;transition:color .2s}
#officialSite:hover{background:none;color:#ff714d;text-decoration:underline}
#officialCopyStatus{display:block;margin-top:8px;min-height:14px;font-size:10px;color:var(--muted)}
#officialCopyStatus:empty{display:none}
main{animation:pageEntrance .7s cubic-bezier(.2,.8,.2,1) both}
.capture-ready .capture-header{animation:pageEntrance .65s ease both}
.capture-ready .capture-field{animation:pageEntrance .6s ease both}
.capture-ready .capture-field:nth-child(1){animation-delay:.08s}
.capture-ready .capture-field:nth-child(2){animation-delay:.16s}
@keyframes pageEntrance{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){main,.capture-ready .capture-header,.capture-ready .capture-field{animation:none}}
.preview-notice{font-size:11px;text-align:center;color:var(--accent);margin:0 0 20px}
@media(max-width:520px){body{padding:100px 14px 24px;align-items:flex-start}.page-logo{top:20px;left:20px;width:48px;height:48px}main{padding:28px 22px;border-radius:20px}h1{font-size:24px}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js" defer></script>
  
  
</head>
<body>
  <img id="pageLogo" class="page-logo" src="assets/logo.webp" alt="CIM Global Parts" width="58" height="58">
  <main>
    <header class="capture-header">
      <img id="captureMark" class="capture-mark" src="assets/logo.webp" alt="CIM Global Parts" width="72" height="72"><img id="photo" alt="Foto da campanha" hidden>
      <h1 id="displayName">Página não encontrada</h1>
      <button id="officialSite" type="button" aria-label="Copiar link do Site Oficial" hidden>Site Oficial</button>
      <span id="officialCopyStatus" role="status" aria-live="polite"></span>
    </header>
    <p id="loading" class="capture-loading">Verificando página…</p>
    <form id="capture" novalidate hidden>
      <div class="capture-field">
        <label for="cnpj">CNPJ do cliente</label>
        <input id="cnpj" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00" autocomplete="off" aria-describedby="cnpjError">
        <span id="cnpjError" class="field-error" aria-live="polite"></span>
      </div>
      <div class="capture-field">
        <label for="phone">Telefone do cliente</label>
        <input id="phone" type="tel" inputmode="numeric" maxlength="15" placeholder="(11) 99999-9999" autocomplete="off" aria-describedby="phoneError">
        <span id="phoneError" class="field-error" aria-live="polite"></span>
      </div>
      <div class="capture-permission">
        <label for="consent"><input id="consent" type="checkbox" aria-describedby="consentError"><span>Confirmo que o cliente autorizou o uso destes dados pela CIM para contato comercial, inclusive pelo WhatsApp, e vínculo com seu cadastro.</span></label>
        <span id="consentError" class="field-error" aria-live="polite"></span>
      </div>
      <button id="send" type="submit">Registrar contato <span aria-hidden="true">→</span></button>
    </form>
    <p id="message" class="capture-message" role="status" aria-live="polite"></p>
    <div id="success" hidden>
      <div class="success-icon" aria-hidden="true">✓</div>
      <h2>Contato salvo</h2>
      <p>Você pode continuar coletando contatos nesta campanha.</p>
      <button id="another" type="button">Registrar outro contato</button>
    </div>
  </main>
<!-- CÓDIGO: campanha, validação e gravação do contato -->
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBVtlnA85ugvll5hLAvOF8FuM4BGnKEovM",
  authDomain: "redx-6b53f.firebaseapp.com",
  databaseURL: "https://redx-6b53f-default-rtdb.firebaseio.com",
  projectId: "redx-6b53f",
  storageBucket: "redx-6b53f.firebasestorage.app",
  messagingSenderId: "194933965008",
  appId: "1:194933965008:web:ae1dae6df66ea44259ded5"
};
const captureElement=id=>document.getElementById(id);
const captureDigits=value=>String(value||'').replace(/\D/g,'');
function captureValidCnpj(value){
  const digits=captureDigits(value);
  if(!/^\d{14}$/.test(digits)||/^(\d)\1{13}$/.test(digits))return false;
  function check(length){const weights=length===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];const sum=weights.reduce((total,weight,index)=>total+Number(digits[index])*weight,0);const remainder=sum%11;return remainder<2?0:11-remainder;}
  return check(12)===Number(digits[12])&&check(13)===Number(digits[13]);
}
function captureValidPhone(value){return /^[1-9][0-9]([2-5][0-9]{7}|9[0-9]{8})$/.test(captureDigits(value));}
function captureCnpjMask(value){return captureDigits(value).slice(0,14).replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');}
function capturePhoneMask(value){const digits=captureDigits(value).slice(0,11);return digits.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{4,5})(\d{4})$/,'$1-$2');}
let captureDatabase=null,captureCampaign=null,captureCampaignId='',capturePreview=false,captureBusy=false;
function captureMessage(text,error=false){captureElement('message').textContent=text;captureElement('message').classList.toggle('error',error);}
function showUnavailablePage(title='Página não encontrada',message='404 · A página que você procura não existe ou não está mais disponível.'){
  document.body.classList.add('unavailable-page');
  document.title=title+' | CIM';
  captureElement('capture').hidden=true;
  captureElement('success').hidden=true;
  captureElement('photo').hidden=true;
  captureElement('captureMark').hidden=true;
  captureElement('loading').hidden=true;
  captureElement('displayName').textContent=title;
  const header=document.querySelector('.capture-header');
  header.prepend(captureElement('pageLogo'));
  captureMessage(message);
}
async function initCapture(){
  const params=new URLSearchParams(location.search);
  capturePreview=params.get('preview')==='1';
  captureCampaignId=params.get('campaign')||params.get('campaignId')||params.get('c')||'';
  try{
    if(capturePreview){
      captureCampaign={name:'Prospecção comercial',displayName:'Equipe CIM · Global Parts',active:true,officialUrl:'https://cimautoparts.com.br/site-oficial'};
      const notice=document.createElement('p');notice.className='preview-notice';notice.textContent='Prévia do layout · nenhum contato será salvo';captureElement('capture').before(notice);
    }else{
      if(!/^[a-zA-Z0-9_-]{2,64}$/.test(captureCampaignId)){showUnavailablePage();return;}
      if(typeof firebase==='undefined')throw new Error('Não foi possível conectar. Verifique sua internet e recarregue a página.');
      if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
      captureDatabase=firebase.database();
      const snapshot=await captureDatabase.ref('leadCampaigns/'+captureCampaignId).once('value');
      captureCampaign=snapshot.val();
      if(!captureCampaign||captureCampaign.active!==true){showUnavailablePage();return;}
    }
    captureElement('displayName').textContent=captureCampaign.displayName||'Coleta de contatos';
    if(String(captureCampaign.image||'').startsWith('https://')){const photo=captureElement('photo');photo.src=captureCampaign.image;photo.hidden=false;captureElement('captureMark').hidden=true;}
    captureElement('officialSite').hidden=!captureSafeOfficialUrl(captureCampaign.officialUrl);
    captureElement('capture').hidden=false;
    document.body.classList.add('capture-ready');
  }catch(error){showUnavailablePage('Página indisponível','Não foi possível abrir esta página. Tente novamente mais tarde.');}
  finally{captureElement('loading').hidden=true;}
}
function captureSafeOfficialUrl(value){
  try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password?url.href:'';}catch(error){return '';}
}
async function copyOfficialSite(){
  const url=captureSafeOfficialUrl(captureCampaign?.officialUrl);if(!url)return;
  const button=captureElement('officialSite');button.disabled=true;
  try{
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);}
    else{
      const input=document.createElement('textarea');input.value=url;input.style.position='fixed';input.style.opacity='0';
      document.body.append(input);input.select();
      try{if(!document.execCommand('copy'))throw new Error('copy failed');}finally{input.remove();button.focus();}
    }
    captureElement('officialCopyStatus').textContent='Link copiado';
  }catch(error){captureElement('officialCopyStatus').textContent='Não foi possível copiar. Tente novamente.';}
  finally{button.disabled=false;}
}
document.addEventListener('DOMContentLoaded',()=>{
  captureElement('officialSite').addEventListener('click',copyOfficialSite);
  captureElement('cnpj').addEventListener('input',event=>{event.target.value=captureCnpjMask(event.target.value);captureElement('cnpjError').textContent='';event.target.removeAttribute('aria-invalid');});
  captureElement('phone').addEventListener('input',event=>{event.target.value=capturePhoneMask(event.target.value);captureElement('phoneError').textContent='';event.target.removeAttribute('aria-invalid');});
  captureElement('consent').addEventListener('change',()=>{captureElement('consentError').textContent='';});
  captureElement('photo').addEventListener('error',()=>{captureElement('photo').hidden=true;captureElement('captureMark').hidden=false;});
  captureElement('another').addEventListener('click',()=>{captureElement('capture').reset();captureElement('success').hidden=true;captureElement('capture').hidden=false;captureMessage('');captureElement('cnpj').focus();});
  captureElement('capture').addEventListener('submit',async event=>{
    event.preventDefault();if(captureBusy)return;captureMessage('');
    const cnpj=captureDigits(captureElement('cnpj').value),phone=captureDigits(captureElement('phone').value),consent=captureElement('consent').checked;
    const errors={cnpj:captureValidCnpj(cnpj)?'':'Informe um CNPJ válido com 14 dígitos.',phone:captureValidPhone(phone)?'':'Informe um telefone válido com DDD.',consent:consent?'':'Confirme a autorização do cliente.'};
    Object.entries(errors).forEach(([field,text])=>{captureElement(field+'Error').textContent=text;captureElement(field).setAttribute('aria-invalid',String(!!text));});
    const invalid=Object.keys(errors).find(key=>errors[key]);if(invalid){captureElement(invalid).focus();return;}
    if(capturePreview){captureMessage('Esta é uma prévia. Use o link de uma campanha para salvar contatos.');return;}
    if(!captureDatabase||!captureCampaign?.active){captureMessage('A campanha não está disponível. Recarregue a página.',true);return;}
    captureBusy=true;captureElement('send').disabled=true;
    try{
      await captureDatabase.ref('leads/'+cnpj+'/captures').push().set({cnpj,phone,campaignId:captureCampaignId,campaignName:captureCampaign.name,capturedAt:firebase.database.ServerValue.TIMESTAMP,consent:true,consentVersion:'commercial-v1'});
      captureElement('capture').hidden=true;captureElement('success').hidden=false;
    }catch(error){captureMessage('Não foi possível salvar. Verifique a conexão e se a campanha continua ativa.',true);}
    finally{captureBusy=false;captureElement('send').disabled=false;}
  });
  initCapture();
});
</script>
</body>
</html>
