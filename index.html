<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tela de Login e Cadastro</title>
    
    <!-- Otimizações de Carregamento Prévio (Preconnect & DNS-Prefetch) -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.postimg.cc" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs com carregamento diferido (defer) -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        /* Aceleração via GPU */
        .gpu-accelerated {
            transform: translateZ(0);
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        /* Impedir zoom automático no Safari/Chrome Mobile ao focar nos campos */
        @media screen and (max-width: 768px) {
            input[type="text"],
            input[type="password"],
            input[type="email"],
            input[type="number"],
            select,
            textarea {
                font-size: 16px !important;
            }
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: '#000000',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-cover bg-center bg-no-repeat flex items-center justify-center p-4 overflow-x-hidden relative" style="background-image: url('https://i.postimg.cc/XvG83Dvg/IMG-5438.jpg');">

    <!-- Dark Overlay com Aceleração por Hardware -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-[2px] gpu-accelerated"></div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-white/20 overflow-hidden relative z-10 transform-gpu gpu-accelerated">
        
        <div id="messageBox" class="hidden mx-8 mt-6 p-4 rounded-xl text-sm flex items-center gap-3 transition-all duration-200">
            <i id="messageIcon" class="fa-solid fa-circle-info text-lg"></i>
            <span id="messageText" class="font-medium"></span>
        </div>

        <!-- ==================== LOGIN FORM ==================== -->
        <form id="loginForm" class="p-8 space-y-5" onsubmit="handleLogin(event)">
            
            <div class="text-center pt-2 pb-2 flex flex-col items-center justify-center">
                <img src="https://i.postimg.cc/Qx3MhBfb/Preto.png" alt="Logo" width="160" height="80" decoding="async" fetchpriority="high" class="h-20 w-auto object-contain mb-2" onerror="this.style.display='none'">
            </div>

            <button type="button" onclick="handleGoogleLogin()"
                class="w-full py-3 px-4 bg-white hover:bg-gray-50 text-gray-700 font-medium border border-gray-200 rounded-full shadow-sm hover:shadow active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-3 text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 transform-gpu">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c-.07-.8-.64-1.55-1.42-1.74H12v4.57h6.61c-.3 1.58-1.57 2.82-3.25 3.3l3.69 2.86c2.16-1.99 3.69-4.94 3.69-8.99z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.69-2.86c-1.08.72-2.46 1.22-4.24 1.22-3.26 0-6.02-2.2-7-5.17H1.19v2.96C3.17 21.36 7.24 24 12 24z"/>
                    <path fill="#FBBC05" d="M5 14.28c-.25-.72-.39-1.5-.39-2.28s.14-1.56.39-2.28V6.76H1.19C.43 8.28 0 10.08 0 12s.43 3.72 1.19 5.24l3.81-2.96z"/>
                    <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.64 1.19 6.76l3.81 2.96c.98-2.97 3.74-5.17 7-5.17z"/>
                </svg>
                <span>Continuar com o Google</span>
            </button>

            <div class="flex items-center my-3">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="px-3 text-xs text-gray-400 uppercase">ou</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <div class="space-y-1">
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">E-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required placeholder="seu@email.com"
                        class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">Senha</label>
                </div>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full mt-2 py-3 px-4 bg-black hover:opacity-90 text-white font-semibold rounded-full shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black transform-gpu">
                <span>Entrar</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>

            <p class="text-center text-xs text-gray-500 pt-3">
                Não tem uma conta? 
                <a href="#" onclick="switchView('register')" class="text-black font-semibold hover:underline">Cadastre-se</a>
            </p>
        </form>

        <!-- ==================== REGISTER FORM ==================== -->
        <form id="registerForm" class="hidden p-8 space-y-4 max-h-[85vh] overflow-y-auto" onsubmit="handleRegister(event)">
            
            <div class="flex items-center justify-between pb-1">
                <h2 class="text-base font-bold text-gray-900">Criar Conta</h2>
                <button type="button" onclick="handleRegisterBack()" class="text-xs text-gray-500 hover:text-black font-medium transition-colors">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Voltar
                </button>
            </div>

            <div class="text-center pt-1 pb-1 flex flex-col items-center justify-center">
                <img src="https://i.postimg.cc/Qx3MhBfb/Preto.png" alt="Logo" width="130" height="65" decoding="async" class="h-16 w-auto object-contain mb-2" onerror="this.style.display='none'">
            </div>

            <button type="button" onclick="handleGoogleLogin()"
                class="w-full py-3 px-4 bg-white hover:bg-gray-50 text-gray-700 font-medium border border-gray-200 rounded-full shadow-sm hover:shadow active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-3 text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 transform-gpu">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c-.07-.8-.64-1.55-1.42-1.74H12v4.57h6.61c-.3 1.58-1.57 2.82-3.25 3.3l3.69 2.86c2.16-1.99 3.69-4.94 3.69-8.99z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.69-2.86c-1.08.72-2.46 1.22-4.24 1.22-3.26 0-6.02-2.2-7-5.17H1.19v2.96C3.17 21.36 7.24 24 12 24z"/>
                    <path fill="#FBBC05" d="M5 14.28c-.25-.72-.39-1.5-.39-2.28s.14-1.56.39-2.28V6.76H1.19C.43 8.28 0 10.08 0 12s.43 3.72 1.19 5.24l3.81-2.96z"/>
                    <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.64 1.19 6.76l3.81 2.96c.98-2.97 3.74-5.17 7-5.17z"/>
                </svg>
                <span>Cadastrar com o Google</span>
            </button>

            <div class="flex items-center my-2">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="px-3 text-xs text-gray-400 uppercase">ou</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <!-- Step 1: Person Type Selection -->
            <div id="personTypeContainer" class="space-y-1">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600">Selecione o Tipo de Cadastro</label>
                <div id="personTypeGrid" class="grid grid-cols-2 gap-3">
                    <button type="button" id="btnFisica" onclick="setPersonType('fisica')"
                        class="py-3 px-3 border rounded-xl text-xs font-semibold transition-all active:scale-95 flex flex-col items-center justify-center gap-2 border-gray-200 bg-gray-50 text-gray-700 hover:bg-gray-100 transform-gpu">
                        <i class="fa-solid fa-user text-base"></i> Pessoa Física
                    </button>
                    <button type="button" id="btnJuridica" onclick="setPersonType('juridica')"
                        class="py-3 px-3 border rounded-xl text-xs font-semibold transition-all active:scale-95 flex flex-col items-center justify-center gap-2 border-gray-200 bg-gray-50 text-gray-700 hover:bg-gray-100 transform-gpu">
                        <i class="fa-solid fa-building text-base"></i> Jurídica
                    </button>
                </div>
            </div>

            <!-- Step 2: Form fields (Hidden initially) -->
            <div id="registerFieldsContainer" class="hidden border-t border-gray-100 pt-3 space-y-3 pr-1">
                
                <div class="space-y-1">
                    <label for="regDoc" id="labelDoc" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">CPF</label>
                    <div class="relative">
                        <input type="text" id="regDoc" placeholder="000.000.000-00" maxlength="18" oninput="formatDocument(this)"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                        <div id="docLoading" class="absolute right-3 top-3.5 hidden">
                            <i class="fa-solid fa-spinner animate-spin text-gray-500 text-sm"></i>
                        </div>
                    </div>
                    <p id="docApiFeedback" class="text-[11px] text-gray-500 hidden mt-1 font-medium"></p>
                </div>

                <div class="space-y-1">
                    <label for="regName" id="labelName" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">Nome Completo</label>
                    <input type="text" id="regName" placeholder="Seu nome completo"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                </div>

                <div class="space-y-1">
                    <label for="regPhone" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">Telefone / Celular</label>
                    <div class="relative">
                        <input type="text" id="regPhone" placeholder="(00) 00000-0000" maxlength="15" oninput="formatPhone(this)"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                    </div>
                </div>

                <div id="cepContainer" class="space-y-1">
                    <label for="regCep" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">CEP</label>
                    <div class="relative">
                        <input type="text" id="regCep" placeholder="00000-000" maxlength="9" oninput="formatCep(this)"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                        <div id="cepLoading" class="absolute right-3 top-3.5 hidden">
                            <i class="fa-solid fa-spinner animate-spin text-gray-500 text-sm"></i>
                        </div>
                    </div>
                    <p id="cepApiFeedback" class="text-[11px] text-gray-500 hidden mt-1 font-medium"></p>
                </div>

                <div id="addressExtraFields" class="space-y-3 pt-1 border-t border-dashed border-gray-200">
                    <div id="juridicaExtraHeader" class="hidden">
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <div class="space-y-1">
                                <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Nome Fantasia</label>
                                <input type="text" id="regFantasia" readonly placeholder="Automático via CNPJ"
                                    class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 text-base sm:text-xs focus:outline-none cursor-not-allowed">
                            </div>
                            <div class="space-y-1">
                                <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Situação</label>
                                <input type="text" id="regSituacao" readonly placeholder="Ativa"
                                    class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 text-base sm:text-xs focus:outline-none cursor-not-allowed">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div class="col-span-2 space-y-1">
                            <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Logradouro / Endereço</label>
                            <input type="text" id="regLogradouro" readonly placeholder="Preenchido via CEP/CNPJ"
                                class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 text-base sm:text-xs focus:outline-none cursor-not-allowed">
                        </div>
                        <div class="space-y-1">
                            <div class="flex items-center justify-between">
                                <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Número</label>
                                <label class="flex items-center gap-1 text-[9px] text-gray-500 cursor-pointer">
                                    <input type="checkbox" id="noNumberCheckbox" onchange="toggleNoNumber(this)" class="rounded text-black focus:ring-0"> S/N
                                </label>
                            </div>
                            <input type="text" id="regNumero" placeholder="Nº"
                                class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-800 text-base sm:text-xs focus:outline-none focus:ring-1 focus:ring-black">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <div class="flex items-center justify-between">
                            <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Complemento</label>
                            <label class="flex items-center gap-1 text-[9px] text-gray-500 cursor-pointer">
                                <input type="checkbox" id="noComplementCheckbox" onchange="toggleNoComplement(this)" class="rounded text-black focus:ring-0"> Nenhum
                            </label>
                        </div>
                        <input type="text" id="regComplemento" placeholder="Apto, Bloco, Sala (Opcional)"
                            class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-800 text-base sm:text-xs focus:outline-none focus:ring-1 focus:ring-black">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div class="space-y-1">
                            <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Bairro</label>
                            <input type="text" id="regBairro" readonly placeholder="Bairro"
                                class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 text-base sm:text-xs focus:outline-none cursor-not-allowed">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">Município</label>
                            <input type="text" id="regMunicipio" readonly placeholder="Cidade"
                                class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 text-base sm:text-xs focus:outline-none cursor-not-allowed">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-[10px] font-semibold uppercase tracking-wider text-gray-500">UF</label>
                            <input type="text" id="regUf" readonly placeholder="UF"
                                class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 text-base sm:text-xs focus:outline-none cursor-not-allowed">
                        </div>
                    </div>
                </div>

                <div class="space-y-1 pt-1">
                    <label for="regEmail" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">E-mail</label>
                    <input type="email" id="regEmail" placeholder="seu@email.com"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                </div>

                <div class="space-y-1" id="senhaContainer">
                    <label for="regPassword" class="block text-xs font-semibold uppercase tracking-wider text-gray-600">Senha</label>
                    <div class="relative">
                        <input type="password" id="regPassword" placeholder="••••••••"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition-all">
                    </div>
                </div>

                <button type="submit" id="registerBtn"
                    class="w-full mt-2 py-3 px-4 bg-black hover:opacity-90 text-white font-semibold rounded-full shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black transform-gpu">
                    <span>Finalizar Cadastro</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </form>
    </div>

    <script>
        // ===== CONFIGURAÇÃO FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyBVtlnA85ugvll5hLAvOF8FuM4BGnKEovM",
            authDomain: "redx-6b53f.firebaseapp.com",
            databaseURL: "https://redx-6b53f-default-rtdb.firebaseio.com",
            projectId: "redx-6b53f",
            storageBucket: "redx-6b53f.firebasestorage.app",
            messagingSenderId: "194933965008",
            appId: "1:194933965008:web:ae1dae6df66ea44259ded5"
        };

        let auth, database;

        // Inicialização assíncrona do Firebase para evitar travamento da renderização
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                database = firebase.database();

                auth.onAuthStateChanged(user => {
                    if (user) {
                        database.ref(`users/${user.uid}`).once('value').then(snapshot => {
                            if (snapshot.exists()) {
                                window.location.href = 'cim.html';
                            }
                        });
                    }
                });
            }
        });

        // ===== VARIÁVEIS GLOBAIS =====
        let currentPersonType = '';
        let modoGoogleCadastro = false;
        let usuarioGoogle = null;

        // ===== FUNÇÕES DE MENSAGEM =====
        function showMessage(message, type = 'error') {
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            const messageIcon = document.getElementById('messageIcon');

            messageText.textContent = message;
            if (type === 'success') {
                messageBox.className = 'mx-8 mt-6 p-4 rounded-xl text-sm flex items-center gap-3 bg-emerald-50 border border-emerald-200 text-emerald-800';
                messageIcon.className = 'fa-solid fa-circle-check text-lg text-emerald-600';
            } else {
                messageBox.className = 'mx-8 mt-6 p-4 rounded-xl text-sm flex items-center gap-3 bg-rose-50 border border-rose-200 text-rose-800';
                messageIcon.className = 'fa-solid fa-triangle-exclamation text-lg text-rose-600';
            }
            messageBox.classList.remove('hidden');
        }

        // ===== NAVEGAÇÃO ENTRE VIEWS =====
        function switchView(view) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const messageBox = document.getElementById('messageBox');

            messageBox.classList.add('hidden');

            if (view === 'login') {
                modoGoogleCadastro = false;
                usuarioGoogle = null;
                document.getElementById('senhaContainer').style.display = '';
                document.getElementById('regPassword').required = true;
                resetPersonTypeSelection();
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
        }

        // ===== SELEÇÃO DE TIPO DE PESSOA =====
        function setPersonType(type) {
            currentPersonType = type;
            const btnFisica = document.getElementById('btnFisica');
            const btnJuridica = document.getElementById('btnJuridica');
            const labelName = document.getElementById('labelName');
            const regName = document.getElementById('regName');
            const labelDoc = document.getElementById('labelDoc');
            const regDoc = document.getElementById('regDoc');
            const registerFieldsContainer = document.getElementById('registerFieldsContainer');
            const juridicaExtraHeader = document.getElementById('juridicaExtraHeader');
            const cepContainer = document.getElementById('cepContainer');

            regDoc.value = '';
            document.getElementById('docApiFeedback').classList.add('hidden');
            document.getElementById('cepApiFeedback').classList.add('hidden');

            if (type === 'fisica') {
                btnFisica.className = 'py-3 px-3 border-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-2 border-black bg-white text-black shadow-sm col-span-2 w-full transform-gpu';
                btnJuridica.classList.add('hidden');
                
                labelName.textContent = 'Nome Completo';
                regName.placeholder = 'Seu nome completo';
                regName.readOnly = false;
                regName.classList.remove('bg-gray-100', 'cursor-not-allowed');
                regName.classList.add('bg-gray-50');
                labelDoc.textContent = 'CPF';
                regDoc.placeholder = '000.000.000-00';
                juridicaExtraHeader.classList.add('hidden');
                cepContainer.classList.remove('hidden');
            } else {
                btnJuridica.className = 'py-3 px-3 border-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-2 border-black bg-white text-black shadow-sm col-span-2 w-full transform-gpu';
                btnFisica.classList.add('hidden');

        // ===== FORMATAÇÃO E CONSULTAS =====
        function formatDocument(input) {
            let value = input.value.replace(/\D/g, '');
            if (currentPersonType === 'fisica') {
                if (value.length > 11) value = value.slice(0, 11);
                if (value.length > 9) {
                    value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
                } else if (value.length > 6) {
                    value = value.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
                } else if (value.length > 3) {
                    value = value.replace(/^(\d{3})(\d{0,3}).*/, '$1.$2');
                }
                input.value = value;
                const rawCpf = value.replace(/\D/g, '');
                if (rawCpf.length === 11) verifyCpfData(rawCpf);
            } else {
                if (value.length > 14) value = value.slice(0, 14);
                if (value.length > 12) {
                    value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2}).*/, '$1.$2.$3/$4-$5');
                } else if (value.length > 8) {
                    value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4}).*/, '$1.$2.$3/$4');
                } else if (value.length > 5) {
                    value = value.replace(/^(\d{2})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
                } else if (value.length > 2) {
                    value = value.replace(/^(\d{2})(\d{0,3}).*/, '$1.$2');
                }
                input.value = value;
                const rawCnpj = value.replace(/\D/g, '');
                if (rawCnpj.length === 14) fetchCnpjData(rawCnpj);
            }
        }

        function formatCep(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 8) value = value.slice(0, 8);
            if (value.length > 5) value = value.replace(/^(\d{5})(\d{0,3}).*/, '$1-$2');
            input.value = value;
            const rawCep = value.replace(/\D/g, '');
            if (rawCep.length === 8) fetchCepData(rawCep);
        }

        function formatPhone(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 10) {
                value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else if (value.length > 2) {
                value = value.replace(/^(\d{2})(\d{0,5}).*/, '($1) $2');
            } else if (value.length > 0) {
                value = value.replace(/^(\d{0,2}).*/, '($1');
            }
            input.value = value;
        }

        async function verifyCpfData(cpf) {
            const loadingIndicator = document.getElementById('docLoading');
            const feedback = document.getElementById('docApiFeedback');
            loadingIndicator.classList.remove('hidden');
            feedback.classList.add('hidden');

            try {
                if (validateCpfAlgorithm(cpf)) {
                    feedback.textContent = '✓ CPF válido e verificado com sucesso.';
                    feedback.className = 'text-[11px] text-emerald-600 mt-1 font-medium block';
                } else {
                    throw new Error('CPF inválido.');
                }
            } catch (error) {
                feedback.textContent = '⚠ CPF inválido ou com dígitos incorretos.';
                feedback.className = 'text-[11px] text-rose-600 mt-1 font-medium block';
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function validateCpfAlgorithm(strCPF) {
            let sum = 0;
            let remainder;
            if (strCPF === "00000000000" || strCPF.length !== 11) return false;
            for (let i = 1; i <= 9; i++) sum += parseInt(strCPF.substring(i - 1, i)) * (11 - i);
            remainder = (sum * 10) % 11;
            if (remainder === 10 || remainder === 11) remainder = 0;
            if (remainder !== parseInt(strCPF.substring(9, 10))) return false;
            sum = 0;
            for (let i = 1; i <= 10; i++) sum += parseInt(strCPF.substring(i - 1, i)) * (12 - i);
            remainder = (sum * 10) % 11;
            if (remainder === 10 || remainder === 11) remainder = 0;
            if (remainder !== parseInt(strCPF.substring(10, 11))) return false;
            return true;
        }

        async function fetchCnpjData(cnpj) {
            const loadingIndicator = document.getElementById('docLoading');
            const feedback = document.getElementById('docApiFeedback');
            loadingIndicator.classList.remove('hidden');
            feedback.classList.add('hidden');

            try {
                const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
                if (!response.ok) throw new Error('CNPJ não encontrado.');
                const data = await response.json();

                document.getElementById('regName').value = data.razao_social || '';
                document.getElementById('regFantasia').value = data.nome_fantasia || data.razao_social || '';
                document.getElementById('regSituacao').value = data.descricao_situacao_cadastral || 'Ativa';
                document.getElementById('regLogradouro').value = data.logradouro || '';
                document.getElementById('regNumero').value = data.numero || '';
                document.getElementById('regBairro').value = data.bairro || '';
                document.getElementById('regMunicipio').value = data.municipio || '';
                document.getElementById('regUf').value = data.uf || '';

                if (data.email && !document.getElementById('regEmail').value) {
                    document.getElementById('regEmail').value = data.email.toLowerCase();
                }

                feedback.textContent = '✓ CNPJ verificado e dados carregados com sucesso.';
                feedback.className = 'text-[11px] text-emerald-600 mt-1 font-medium block';
            } catch (error) {
                feedback.textContent = '⚠ CNPJ não encontrado ou erro na consulta.';
                feedback.className = 'text-[11px] text-rose-600 mt-1 font-medium block';
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        async function fetchCepData(cep) {
            const loadingIndicator = document.getElementById('cepLoading');
            const feedback = document.getElementById('cepApiFeedback');
            loadingIndicator.classList.remove('hidden');
            feedback.classList.add('hidden');

            try {
                const response = await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`);
                if (!response.ok) throw new Error('CEP não encontrado.');
                const data = await response.json();

                document.getElementById('regLogradouro').value = data.street || '';
                document.getElementById('regBairro').value = data.neighborhood || '';
                document.getElementById('regMunicipio').value = data.city || '';
                document.getElementById('regUf').value = data.state || '';

                feedback.textContent = '✓ Endereço preenchido automaticamente via CEP.';
                feedback.className = 'text-[11px] text-emerald-600 mt-1 font-medium block';
            } catch (error) {
                feedback.textContent = '⚠ CEP não encontrado.';
                feedback.className = 'text-[11px] text-rose-600 mt-1 font-medium block';
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function toggleNoNumber(checkbox) {
            const numInput = document.getElementById('regNumero');
            if (checkbox.checked) {
                numInput.value = 'S/N';
                numInput.disabled = true;
                numInput.classList.add('bg-gray-100', 'cursor-not-allowed');
            } else {
                numInput.value = '';
                numInput.disabled = false;
                numInput.classList.remove('bg-gray-100', 'cursor-not-allowed');
            }
        }

        function toggleNoComplement(checkbox) {
            const compInput = document.getElementById('regComplemento');
            if (checkbox.checked) {
                compInput.value = 'Nenhum';
                compInput.disabled = true;
                compInput.classList.add('bg-gray-100', 'cursor-not-allowed');
            } else {
                compInput.value = '';
                compInput.disabled = false;
                compInput.classList.remove('bg-gray-100', 'cursor-not-allowed');
            }
        }

        // ===== SALVAR DADOS NO FIREBASE =====
        async function salvarDadosUsuario(uid) {
            if (!database) return;

            const dados = {
                email: document.getElementById('regEmail').value.trim(),
                userType: currentPersonType === 'fisica' ? 'PF' : 'PJ',
                telefone: document.getElementById('regPhone').value.replace(/\D/g, ''),
                createdAt: Date.now(),
                lastAccess: Date.now(),
                photoURL: 'https://i.ibb.co/6J5qZ9K/default-avatar.png',
                mustChangePassword: false
            };

            if (currentPersonType === 'fisica') {
                dados.name = document.getElementById('regName').value.trim();
                dados.cpf = document.getElementById('regDoc').value.replace(/\D/g, '');
                dados.cep = document.getElementById('regCep').value.replace(/\D/g, '');
                dados.logradouro = document.getElementById('regLogradouro').value;
                dados.numero = document.getElementById('regNumero').value;
                dados.complemento = document.getElementById('regComplemento').value || '';
                dados.bairro = document.getElementById('regBairro').value;
                dados.cidade = document.getElementById('regMunicipio').value;
                dados.uf = document.getElementById('regUf').value;
            } else {
                dados.cnpj = document.getElementById('regDoc').value.replace(/\D/g, '');
                dados.inscricao_estadual = '';
                dados.name = document.getElementById('regName').value.trim();
                dados.cep = document.getElementById('regCep').value.replace(/\D/g, '');
                dados.logradouro = document.getElementById('regLogradouro').value;
                dados.numero = document.getElementById('regNumero').value;
                dados.complemento = document.getElementById('regComplemento').value || '';
                dados.bairro = document.getElementById('regBairro').value;
                dados.cidade = document.getElementById('regMunicipio').value;
                dados.uf = document.getElementById('regUf').value;
                dados.nome_fantasia = document.getElementById('regFantasia').value || '';
                dados.situacao_cadastral = document.getElementById('regSituacao').value || '';
            }

            await database.ref(`users/${uid}`).update(dados);
        }

        // ===== LOGIN =====
        async function handleLogin(event) {
            event.preventDefault();
            if (!auth) return;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-sm"></i><span>Entrando...</span>';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = 'cim.html';
            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Entrar</span><i class="fa-solid fa-arrow-right text-xs"></i>';
                showMessage('Erro ao realizar login. Verifique seus dados e tente novamente.', 'error');
            }
        }

        // ===== CADASTRO =====
        async function handleRegister(event) {
            event.preventDefault();

            if (modoGoogleCadastro && usuarioGoogle) {
                try {
                    await salvarDadosUsuario(usuarioGoogle.uid);
                    window.location.href = 'cim.html';
                } catch (error) {
                    showMessage('Erro ao salvar dados. Tente novamente.', 'error');
                }
                return;
            }

            const name = document.getElementById('regName').value.trim();
            const doc = document.getElementById('regDoc').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const registerBtn = document.getElementById('registerBtn');

            if (!currentPersonType) {
                showMessage('Selecione o tipo de pessoa (Física ou Jurídica).', 'error');
                return;
            }
            if (!name || !doc || !phone || !email || password.length < 6) {
                showMessage('Preencha todos os campos obrigatórios corretamente.', 'error');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-sm"></i><span>Cadastrando...</span>';

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                await salvarDadosUsuario(userCredential.user.uid);
                window.location.href = 'cim.html';
            } catch (error) {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<span>Finalizar Cadastro</span><i class="fa-solid fa-arrow-right text-xs"></i>';
                showMessage('Erro ao criar conta. Verifique seus dados e tente novamente.', 'error');
            }
        }

        // ===== GOOGLE LOGIN =====
        async function handleGoogleLogin() {
            if (!auth) return;
            const provider = new firebase.auth.GoogleAuthProvider();

            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                const snapshot = await database.ref(`users/${user.uid}`).once('value');
                if (snapshot.exists()) {
                    window.location.href = 'cim.html';
                } else {
                    modoGoogleCadastro = true;
                    usuarioGoogle = user;

                    document.getElementById('regEmail').value = user.email || '';
                    document.getElementById('regName').value = user.displayName || '';

                    document.getElementById('senhaContainer').style.display = 'none';
                    document.getElementById('regPassword').required = false;

                    switchView('register');
                }
            } catch (error) {
                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('A janela de autenticação foi fechada. Tente novamente.', 'error');
                } else if (error.code === 'auth/popup-blocked') {
                    showMessage('Permita pop-ups para usar a autenticação com Google.', 'error');
                } else {
                    showMessage('Erro ao autenticar com Google. Tente novamente.', 'error');
                }
            }
        }
