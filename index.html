<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login / Cadastro - CIM Global Parts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0a0a',
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* Gradiente estilo "néblina" suave na parte inferior */
        .banner-gradient {
            background: linear-gradient(
                to bottom,
                rgba(10, 10, 10, 0) 0%,
                rgba(10, 10, 10, 0.1) 40%,
                rgba(10, 10, 10, 0.6) 75%,
                #0a0a0a 100%
            );
            z-index: 10;
        }

        /* Efeito de cursor piscando */
        .cursor-blink {
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Sublinhado fino personalizado */
        .thin-underline {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        /* Previne zoom automático em dispositivos móveis (tamanho >= 16px) */
        input, select {
            font-size: 16px !important;
        }

        /* Transição suave para os campos do formulário */
        .form-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Estilo para campos vazios com erro */
        .input-error {
            border: 1px solid #ef4444 !important;
        }

        /* Máscara de telefone */
        .phone-mask {
            font-family: monospace;
            letter-spacing: 1px;
        }

        /* Estilo para campos travados pela API */
        .campo-travado {
            background-color: #161616 !important;
            color: #a3a3a3 !important;
            cursor: not-allowed !important;
        }

        .campo-livre {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
        }

        /* Botões de tipo de conta ativo/inativo */
        .tipo-btn-ativo {
            border-color: #52525b !important;
            background-color: #1e1e1e !important;
            color: #ffffff !important;
        }

        .tipo-btn-inativo {
            border-color: #262626 !important;
            background-color: transparent !important;
            color: #a3a3a3 !important;
        }

        .tipo-btn-inativo:hover {
            border-color: #404040 !important;
            color: #d4d4d4 !important;
        }
    </style>
</head>
<body class="bg-darkBg text-white min-h-screen flex flex-col justify-between font-sans selection:bg-white selection:text-black">

    <!-- Container Principal -->
    <header class="w-full">
        <!-- Banner com imagem única -->
        <div class="relative w-full h-[360px] md:h-[440px] overflow-hidden bg-neutral-900">
            <div id="galleryGrid" class="absolute inset-0 flex items-center justify-center p-0 pointer-events-none select-none">
                <img src="https://i.postimg.cc/zfXT6H5c/048CF4DB-78C5-4245-86B0-43E8724842D4.jpg" 
                     class="w-full h-full object-cover" 
                     alt="Banner CIM Global Parts">
            </div>
            <div class="absolute inset-0 banner-gradient pointer-events-none"></div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow flex flex-col items-center justify-center w-full max-w-md mx-auto px-4 py-6">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white mb-6 min-h-[3.5rem] flex items-center justify-center text-center">
            <span id="typed-text"></span><span class="cursor-blink font-light text-white ml-1">|</span>
        </h1>

        <form onsubmit="realizarAcao(event)" class="w-full flex flex-col gap-4 form-transition" id="form-container" novalidate>
            <!-- Tipo de cadastro (oculto por padrão) -->
            <div id="tipo-cadastro-container" class="hidden flex flex-col gap-3 mb-1">
                <span class="text-xs text-neutral-400 font-medium text-left px-1">Selecione o tipo de conta:</span>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="selecionarTipo('fisica')" id="btn-fisica" class="py-3 px-4 rounded-full border text-sm font-medium transition-all focus:outline-none tipo-btn-ativo">
                        Pessoa Física
                    </button>
                    <button type="button" onclick="selecionarTipo('juridica')" id="btn-juridica" class="py-3 px-4 rounded-full border text-sm font-medium transition-all focus:outline-none tipo-btn-inativo">
                        Pessoa Jurídica
                    </button>
                </div>
            </div>

            <!-- Campos dinâmicos -->
            <div id="campos-dinamicos" class="flex flex-col gap-4 w-full form-transition">
                <input type="email" placeholder="E-mail" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                <input type="password" placeholder="Senha" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
            </div>

            <button type="submit" id="btn-principal" class="bg-white text-black font-medium w-full py-4 rounded-full shadow-lg hover:bg-neutral-200 hover:scale-[1.01] active:scale-[0.99] transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-darkBg text-sm mt-1">
                Entre
            </button>
        </form>

        <div class="mt-4">
            <a href="#" onclick="alternarModo(event)" id="link-modo" class="text-neutral-500 text-sm hover:text-neutral-400 transition-colors no-underline">Não tenho cadastro</a>
        </div>

        <div class="w-full flex items-center my-6">
            <div class="flex-grow border-t border-neutral-800"></div>
            <span class="px-3 text-neutral-500 text-xs uppercase tracking-wider">ou</span>
            <div class="flex-grow border-t border-neutral-800"></div>
        </div>

        <button type="button" onclick="acaoGoogle()" class="bg-white text-black font-medium w-full py-3.5 px-6 rounded-full shadow-lg hover:bg-neutral-100 hover:scale-[1.01] active:scale-[0.99] transition-all duration-300 flex items-center justify-center gap-3 text-sm focus:outline-none">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7s.43 3.58 1.19 5.12l4.09-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span id="texto-botao-google">Entre com o Google</span>
        </button>
    </main>

    <footer class="py-6 text-center text-xs text-neutral-500 flex flex-col gap-1.5">
        <div><a href="#" onclick="abrirTermos(event)" class="thin-underline hover:text-neutral-300 transition-colors">Termo de privacidade</a></div>
        <div>&copy; 2026 Todos os direitos reservados.</div>
    </footer>

    <!-- Modal -->
    <div id="modalEntrada" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <div class="bg-[#121212] border border-neutral-800 p-8 rounded-2xl max-w-sm w-full mx-4 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <h3 class="text-xl font-medium text-white mb-2" id="modalTitulo">Acesso Autorizado</h3>
            <p class="text-neutral-400 text-sm mb-4" id="modalMensagem">Você entrou com sucesso no sistema.</p>
            <div id="modalAcoes" class="flex flex-col gap-2">
                <button onclick="fecharModalEntrada()" id="modalBtnPrincipal" class="bg-white text-black font-medium w-full py-3 rounded-full hover:bg-neutral-200 transition-colors text-sm">Continuar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBVtlnA85ugvll5hLAvOF8FuM4BGnKEovM",
            authDomain: "redx-6b53f.firebaseapp.com",
            databaseURL: "https://redx-6b53f-default-rtdb.firebaseio.com",
            projectId: "redx-6b53f",
            storageBucket: "redx-6b53f.firebasestorage.app",
            messagingSenderId: "194933965008",
            appId: "1:194933965008:web:ae1dae6df66ea44259ded5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let modoCriarConta = false;
        let tipoPessoa = 'fisica';
        let modoGoogleCadastro = false;
        let consultaCNPJAtual = 0;
        let modalCallback = null;

        // Efeito de digitação
        const textoCompleto = "Olá, seja bem-vindo ao catálogo CIM Global Parts";
        let i = 0;
        const velocidade = 100;
        function digitarTexto() {
            if (i < textoCompleto.length) {
                document.getElementById("typed-text").innerHTML += textoCompleto.charAt(i);
                i++;
                setTimeout(digitarTexto, velocidade);
            }
        }

        window.onload = function() {
            // Inicia a digitação
            setTimeout(digitarTexto, 600);
        };

        // ========== MÁSCARAS ==========
        function formatarTelefone(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 11) v = v.substring(0, 11);
            
            if (v.length <= 2) {
                v = v.replace(/(\d{0,2})/, "($1");
            } else if (v.length <= 6) {
                v = v.replace(/(\d{2})(\d{0,4})/, "($1) $2");
            } else if (v.length <= 10) {
                v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
            } else {
                v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
            }
            
            input.value = v;
        }

        function formatarCPF(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 11) v = v.substring(0, 11);
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            input.value = v;
        }

        function formatarCEP(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 8) v = v.substring(0, 8);
            v = v.replace(/(\d{5})(\d)/, "$1-$2");
            input.value = v;
            if (v.replace(/\D/g, "").length === 8) consultarCEP(v.replace(/\D/g, ""));
        }

        function formatarCNPJ(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 14) v = v.substring(0, 14);
            v = v.replace(/^(\d{2})(\d)/, "$1.$2");
            v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
            v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
            v = v.replace(/(\d{4})(\d)/, "$1-$2");
            input.value = v;
            if (v.replace(/\D/g, "").length === 14) consultarCNPJ(v.replace(/\D/g, ""));
            else limparStatusCNPJ();
        }

        // ========== CONSULTAS API ==========
        async function consultarCEP(cep) {
            try {
                const response = await fetch(`https://brasilapi.com.br/api/cep/v1/${cep}`);
                if (!response.ok) throw new Error('CEP não encontrado');
                const data = await response.json();
                if (document.getElementById('cep-rua')) document.getElementById('cep-rua').value = data.street || '';
                if (document.getElementById('cep-bairro')) document.getElementById('cep-bairro').value = data.neighborhood || '';
                if (document.getElementById('cep-cidade')) document.getElementById('cep-cidade').value = data.city || '';
                if (document.getElementById('cep-estado')) document.getElementById('cep-estado').value = data.state || '';
            } catch (err) { console.error(err); }
        }

        function pausa(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function definirCampoEmpresa(id, valor) {
            const el = document.getElementById(id);
            if (!el) return;
            const temValor = valor !== undefined && valor !== null && valor.toString().trim() !== '';
            if (temValor) {
                el.value = valor;
                el.readOnly = true;
                el.classList.remove('campo-livre');
                el.classList.add('campo-travado');
            } else {
                el.value = '';
                el.readOnly = false;
                el.classList.remove('campo-travado');
                el.classList.add('campo-livre');
            }
        }

        function liberarCamposEmpresaManual() {
            ['empresa-nome', 'empresa-cep', 'empresa-logradouro', 'empresa-bairro', 'empresa-cidade', 'empresa-uf'].forEach(id => {
                definirCampoEmpresa(id, '');
            });
        }

        async function consultarCNPJ(cnpj) {
            const idConsulta = ++consultaCNPJAtual;
            const statusIcon = document.getElementById('cnpj-status-icon');
            const cnpjMsg = document.getElementById('cnpj-msg');
            statusIcon.innerHTML = `<span class="text-xs text-neutral-400 animate-pulse">verificando...</span>`;
            cnpjMsg.innerText = "";

            const MAX_TENTATIVAS = 3;
            let data = null;
            let naoEncontrado = false;

            for (let tentativa = 1; tentativa <= MAX_TENTATIVAS; tentativa++) {
                try {
                    const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);

                    if (idConsulta !== consultaCNPJAtual) return;

                    if (response.status === 404) {
                        naoEncontrado = true;
                        break;
                    }

                    if (!response.ok) {
                        throw new Error('status ' + response.status);
                    }

                    data = await response.json();
                    break;
                } catch (err) {
                    if (idConsulta !== consultaCNPJAtual) return;
                    if (tentativa < MAX_TENTATIVAS) {
                        await pausa(500 * tentativa);
                    }
                }
            }

            if (idConsulta !== consultaCNPJAtual) return;

            if (naoEncontrado) {
                statusIcon.innerHTML = `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                cnpjMsg.innerText = "CNPJ não encontrado. Confira o número ou preencha os dados manualmente.";
                cnpjMsg.className = "text-xs text-red-500 mt-1 px-3 text-left font-medium";
                liberarCamposEmpresaManual();
                return;
            }

            if (!data) {
                statusIcon.innerHTML = `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                cnpjMsg.innerText = "Não foi possível verificar o CNPJ agora. Você pode preencher os dados manualmente ou digitar o número novamente.";
                cnpjMsg.className = "text-xs text-red-500 mt-1 px-3 text-left font-medium";
                liberarCamposEmpresaManual();
                return;
            }

            const situacao = data.descricao_situacao_cadastral || data.situacao_cadastral;
            const ativa = situacao && situacao.toString().toUpperCase().includes('ATIVA');

            if (ativa) {
                statusIcon.innerHTML = `<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                cnpjMsg.innerText = "";
                definirCampoEmpresa('empresa-nome', data.razao_social || data.nome_fantasia);
                definirCampoEmpresa('empresa-cep', data.cep);
                definirCampoEmpresa('empresa-logradouro', data.logradouro);
                definirCampoEmpresa('empresa-bairro', data.bairro);
                definirCampoEmpresa('empresa-cidade', data.municipio);
                definirCampoEmpresa('empresa-uf', data.uf);
                if (document.getElementById('empresa-numero') && data.numero) {
                    document.getElementById('empresa-numero').value = data.numero;
                }
            } else {
                statusIcon.innerHTML = `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                cnpjMsg.innerText = "CNPJ inativo";
                cnpjMsg.className = "text-xs text-red-500 mt-1 px-3 text-left font-medium";
                liberarCamposEmpresaManual();
            }
        }

        function limparStatusCNPJ() {
            const statusIcon = document.getElementById('cnpj-status-icon');
            const cnpjMsg = document.getElementById('cnpj-msg');
            if (statusIcon) statusIcon.innerHTML = '';
            if (cnpjMsg) cnpjMsg.innerText = '';
        }

        function toggleSemNumero(checkbox, inputId) {
            const inputNum = document.getElementById(inputId);
            if (checkbox.checked) {
                inputNum.value = 'S/N';
                inputNum.disabled = true;
                inputNum.classList.add('opacity-50');
                inputNum.classList.remove('input-error');
            } else {
                inputNum.value = '';
                inputNum.disabled = false;
                inputNum.classList.remove('opacity-50');
            }
        }

        // ========== FORMULÁRIO ==========
        function alternarModo(event) {
            event.preventDefault();
            
            if (modoGoogleCadastro) {
                modoGoogleCadastro = false;
                modoCriarConta = false;
                
                const inputs = document.querySelectorAll('#campos-dinamicos input');
                const senhaInput = inputs[inputs.length - 1];
                if (senhaInput) {
                    senhaInput.style.display = '';
                    senhaInput.required = true;
                }
                
                document.getElementById('btn-principal').innerText = 'Entre';
                document.getElementById('link-modo').innerText = 'Não tenho cadastro';
                document.getElementById('tipo-cadastro-container').classList.add('hidden');
                renderizarCamposLogin();
                return;
            }
            
            modoCriarConta = !modoCriarConta;
            modoGoogleCadastro = false;

            const btnPrincipal = document.getElementById('btn-principal');
            const linkModo = document.getElementById('link-modo');
            const textoGoogle = document.getElementById('texto-botao-google');
            const tipoContainer = document.getElementById('tipo-cadastro-container');
            const formContainer = document.getElementById('form-container');

            formContainer.style.opacity = '0';
            formContainer.style.transform = 'translateY(10px)';
            setTimeout(() => {
                if (modoCriarConta) {
                    btnPrincipal.innerText = "Crie uma conta";
                    linkModo.innerText = "Já tenho cadastro";
                    textoGoogle.innerText = "Crie uma conta com o Google";
                    tipoContainer.classList.remove('hidden');
                    renderizarCamposCadastro();
                } else {
                    btnPrincipal.innerText = "Entre";
                    linkModo.innerText = "Não tenho cadastro";
                    textoGoogle.innerText = "Entre com o Google";
                    tipoContainer.classList.add('hidden');
                    renderizarCamposLogin();
                    const inputs = document.querySelectorAll('#campos-dinamicos input');
                    if (inputs.length >= 2) {
                        const senha = inputs[inputs.length - 1];
                        senha.style.display = '';
                        senha.required = true;
                    }
                }
                formContainer.style.opacity = '1';
                formContainer.style.transform = 'translateY(0)';
            }, 250);
        }

        function selecionarTipo(tipo) {
            tipoPessoa = tipo;
            
            const btnFisica = document.getElementById('btn-fisica');
            const btnJuridica = document.getElementById('btn-juridica');
            
            btnFisica.className = "py-3 px-4 rounded-full border text-sm font-medium transition-all focus:outline-none";
            btnJuridica.className = "py-3 px-4 rounded-full border text-sm font-medium transition-all focus:outline-none";
            
            if (tipo === 'fisica') {
                btnFisica.classList.add('tipo-btn-ativo');
                btnJuridica.classList.add('tipo-btn-inativo');
            } else {
                btnJuridica.classList.add('tipo-btn-ativo');
                btnFisica.classList.add('tipo-btn-inativo');
            }
            
            if (modoGoogleCadastro) {
                const user = auth.currentUser;
                const inputsAtuais = document.querySelectorAll('#campos-dinamicos input');
                const valoresAtuais = [];
                inputsAtuais.forEach(input => {
                    valoresAtuais.push(input.value);
                });
                
                renderizarCamposCadastro();
                
                const novosInputs = document.querySelectorAll('#campos-dinamicos input');
                novosInputs.forEach((input, index) => {
                    if (index < valoresAtuais.length && valoresAtuais[index]) {
                        input.value = valoresAtuais[index];
                    }
                });
                
                if (user) {
                    const emailInput = document.querySelector('#campos-dinamicos input[type="email"]');
                    if (emailInput) emailInput.value = user.email || '';
                    
                    if (tipo === 'fisica') {
                        const nomeInput = document.querySelector('#campos-dinamicos input[placeholder="Nome completo"]');
                        if (nomeInput && user.displayName) nomeInput.value = user.displayName;
                    } else {
                        const razaoInput = document.getElementById('empresa-nome');
                        if (razaoInput && user.displayName) razaoInput.value = user.displayName;
                    }
                }
            } else {
                renderizarCamposCadastro();
            }
        }

        function renderizarCamposLogin() {
            document.getElementById('campos-dinamicos').innerHTML = `
                <input type="email" placeholder="E-mail" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                <input type="password" placeholder="Senha" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
            `;
        }

        function renderizarCamposCadastro() {
            const container = document.getElementById('campos-dinamicos');
            if (tipoPessoa === 'fisica') {
                container.innerHTML = `
                    <input type="text" placeholder="Nome completo" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="text" placeholder="CPF" maxlength="14" oninput="formatarCPF(this)" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="text" placeholder="Telefone" maxlength="15" oninput="formatarTelefone(this)" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px] phone-mask">
                    <input type="text" placeholder="CEP" maxlength="9" oninput="formatarCEP(this)" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="text" id="cep-rua" placeholder="Logradouro" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <div class="flex gap-2">
                        <input type="text" id="cep-num" placeholder="Número" required class="w-2/3 bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                        <div class="w-1/3 flex items-center px-2">
                            <label class="text-xs text-neutral-400 flex items-center gap-1 cursor-pointer select-none">
                                <input type="checkbox" onchange="toggleSemNumero(this, 'cep-num')" class="rounded bg-neutral-800 border-neutral-700 text-white focus:ring-0"> S/N
                            </label>
                        </div>
                    </div>
                    <input type="text" placeholder="Complemento (opcional)" class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="text" id="cep-bairro" placeholder="Bairro" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="text" id="cep-cidade" placeholder="Cidade" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="text" id="cep-estado" placeholder="Estado (UF)" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="email" placeholder="E-mail" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="password" placeholder="Senha" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                `;
            } else {
                container.innerHTML = `
                    <div class="relative w-full">
                        <input type="text" id="input-cnpj" placeholder="CNPJ" maxlength="18" oninput="formatarCNPJ(this)" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 pr-12 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                        <div id="cnpj-status-icon" class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center pointer-events-none"></div>
                    </div>
                    <div id="cnpj-msg" class="w-full"></div>
                    <input type="text" placeholder="Inscrição estadual" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="text" placeholder="Telefone" maxlength="15" oninput="formatarTelefone(this)" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px] phone-mask">
                    <input type="text" id="empresa-nome" placeholder="Razão Social / Nome da Empresa" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="text" id="empresa-cep" placeholder="CEP" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="text" id="empresa-logradouro" placeholder="Logradouro" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <div class="flex gap-2">
                        <input type="text" id="empresa-numero" placeholder="Número" required class="w-2/3 bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                        <div class="w-1/3 flex items-center px-2">
                            <label class="text-xs text-neutral-400 flex items-center gap-1 cursor-pointer select-none">
                                <input type="checkbox" onchange="toggleSemNumero(this, 'empresa-numero')" class="rounded bg-neutral-800 border-neutral-700 text-white focus:ring-0"> S/N
                            </label>
                        </div>
                    </div>
                    <input type="text" placeholder="Complemento (opcional)" class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="text" id="empresa-bairro" placeholder="Bairro" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="text" id="empresa-cidade" placeholder="Cidade" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="text" id="empresa-uf" placeholder="Estado (UF)" readonly class="w-full bg-[#161616] text-neutral-400 px-6 py-4 rounded-full border-0 outline-none text-[16px] cursor-not-allowed">
                    <input type="email" placeholder="E-mail" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                    <input type="password" placeholder="Senha" required class="w-full bg-[#1e1e1e] text-white placeholder-neutral-500 px-6 py-4 rounded-full border-0 outline-none focus:ring-2 focus:ring-neutral-400 transition-all text-[16px]">
                `;
            }
            
            if (modoGoogleCadastro) {
                const inputs = container.querySelectorAll('input');
                if (inputs.length >= 2) {
                    const senha = inputs[inputs.length - 1];
                    senha.style.display = 'none';
                    senha.required = false;
                }
                document.getElementById('btn-principal').innerText = 'Concluir Cadastro';
            }
        }

        // ========== MODAL ==========
        function showModal(titulo, mensagem, botaoTexto = 'Continuar', redirectUrl = '', callback = null) {
            document.getElementById('modalTitulo').innerText = titulo;
            document.getElementById('modalMensagem').innerHTML = mensagem;
            
            const btn = document.getElementById('modalBtnPrincipal');
            if (botaoTexto) {
                btn.innerText = botaoTexto;
            }
            
            document.getElementById('modalEntrada').dataset.redirect = redirectUrl || '';
            modalCallback = callback;
            
            abrirModal();
        }

        function abrirModal() {
            const modal = document.getElementById('modalEntrada');
            const content = document.getElementById('modalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function fecharModalEntrada() {
            const modal = document.getElementById('modalEntrada');
            const content = document.getElementById('modalContent');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            const redirect = modal.dataset.redirect;
            if (redirect) {
                window.location.href = redirect;
                return;
            }
            
            if (modalCallback) {
                const cb = modalCallback;
                modalCallback = null;
                cb();
            }
        }

        // ========== AÇÕES COM FIREBASE ==========

        // Login com Google
        function acaoGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            
            auth.signInWithPopup(provider)
                .then(result => {
                    const user = result.user;
                    
                    database.ref(`users/${user.uid}`).once('value')
                        .then(snapshot => {
                            if (snapshot.exists()) {
                                const nome = user.displayName || 'Usuário';
                                showModal(
                                    'Bem-vindo de volta',
                                    `Olá ${nome}, seu login foi realizado com sucesso.`,
                                    'Continuar',
                                    'cim.html'
                                );
                            } else {
                                modoGoogleCadastro = true;
                                modoCriarConta = true;
                                
                                const tipoContainer = document.getElementById('tipo-cadastro-container');
                                tipoContainer.classList.remove('hidden');
                                
                                tipoPessoa = 'fisica';
                                atualizarBotoesTipo();
                                
                                renderizarCamposCadastro();
                                
                                const inputs = document.querySelectorAll('#campos-dinamicos input');
                                const emailInput = inputs[inputs.length - 2];
                                if (emailInput) emailInput.value = user.email || '';
                                
                                const senhaInput = inputs[inputs.length - 1];
                                if (senhaInput) {
                                    senhaInput.style.display = 'none';
                                    senhaInput.required = false;
                                }
                                
                                document.getElementById('btn-principal').innerText = 'Concluir Cadastro';
                                document.getElementById('link-modo').innerText = 'Já tenho cadastro';
                                
                                if (user.displayName && tipoPessoa === 'fisica') {
                                    const nomeInput = inputs[0];
                                    if (nomeInput) nomeInput.value = user.displayName;
                                }
                                
                                showModal(
                                    'Cadastro em andamento',
                                    `Olá ${user.displayName || 'Usuário'}, complete os dados abaixo para finalizar seu cadastro.`,
                                    'Ok'
                                );
                            }
                        })
                        .catch(error => {
                            showModal('Erro', 'Não foi possível verificar seus dados. Tente novamente.');
                        });
                })
                .catch(error => {
                    if (error.code === 'auth/popup-closed-by-user') {
                        showModal('Operação cancelada', 'A janela de autenticação foi fechada. Tente novamente.');
                    } else if (error.code === 'auth/popup-blocked') {
                        showModal('Permissão necessária', 'Por favor, permita pop-ups para usar a autenticação com Google.');
                    } else {
                        showModal('Erro', error.message);
                    }
                });
        }

        function atualizarBotoesTipo() {
            const btnFisica = document.getElementById('btn-fisica');
            const btnJuridica = document.getElementById('btn-juridica');
            
            btnFisica.className = "py-3 px-4 rounded-full border text-sm font-medium transition-all focus:outline-none";
            btnJuridica.className = "py-3 px-4 rounded-full border text-sm font-medium transition-all focus:outline-none";
            
            if (tipoPessoa === 'fisica') {
                btnFisica.classList.add('tipo-btn-ativo');
                btnJuridica.classList.add('tipo-btn-inativo');
            } else {
                btnJuridica.classList.add('tipo-btn-ativo');
                btnFisica.classList.add('tipo-btn-inativo');
            }
        }

        // Submissão do formulário
        async function realizarAcao(event) {
            event.preventDefault();
            const inputs = document.querySelectorAll('#campos-dinamicos input');
            let valido = true;
            inputs.forEach(input => {
                if (input === inputs[inputs.length - 1] && modoGoogleCadastro) return;
                if (!input.value.trim() && !input.disabled) {
                    input.classList.add('input-error');
                    valido = false;
                } else {
                    input.classList.remove('input-error');
                }
            });
            if (!valido) { showModal('Atenção', 'Preencha todos os campos obrigatórios.'); return; }

            if (modoGoogleCadastro) {
                const user = auth.currentUser;
                if (!user) { showModal('Erro', 'Usuário não autenticado.'); return; }
                await salvarDadosUsuario(user.uid);
                showModal('Cadastro concluído', 'Sua conta foi criada com sucesso!', 'Continuar', 'cim.html');
                modoGoogleCadastro = false;
                const senhaInput = document.querySelectorAll('#campos-dinamicos input');
                if (senhaInput.length) {
                    senhaInput[senhaInput.length - 1].style.display = '';
                    senhaInput[senhaInput.length - 1].required = true;
                }
                document.getElementById('btn-principal').innerText = modoCriarConta ? 'Crie uma conta' : 'Entre';
                return;
            }

            const allInputs = document.querySelectorAll('#campos-dinamicos input');
            const emailInput = allInputs[allInputs.length - 2];
            const passwordInput = allInputs[allInputs.length - 1];
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (modoCriarConta) {
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await salvarDadosUsuario(userCredential.user.uid);
                    showModal('Conta Criada', `Sua conta (${tipoPessoa === 'fisica' ? 'Pessoa Física' : 'Pessoa Jurídica'}) foi criada com sucesso!`, 'Continuar', 'cim.html');
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') {
                        showModal(
                            'E-mail já cadastrado',
                            'Este e-mail já possui uma conta ativa. Deseja fazer login?',
                            'Fazer Login',
                            '',
                            () => {
                                modoCriarConta = false;
                                document.getElementById('btn-principal').innerText = 'Entre';
                                document.getElementById('link-modo').innerText = 'Não tenho cadastro';
                                document.getElementById('tipo-cadastro-container').classList.add('hidden');
                                renderizarCamposLogin();
                            }
                        );
                    } else {
                        showModal('Erro', error.message);
                    }
                }
            } else {
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    showModal('Login Realizado', 'Autenticação via e-mail concluída com sucesso.', 'Continuar', 'cim.html');
                } catch (error) {
                    if (error.code === 'auth/user-not-found') {
                        showModal(
                            'Usuário não encontrado',
                            'Nenhuma conta encontrada para este e-mail. Deseja criar uma conta?',
                            'Criar conta',
                            '',
                            () => {
                                modoCriarConta = true;
                                document.getElementById('btn-principal').innerText = 'Crie uma conta';
                                document.getElementById('link-modo').innerText = 'Já tenho cadastro';
                                document.getElementById('tipo-cadastro-container').classList.remove('hidden');
                                renderizarCamposCadastro();
                            }
                        );
                    } else if (error.code === 'auth/wrong-password') {
                        showModal('Senha incorreta', 'A senha informada está incorreta. Tente novamente.');
                    } else {
                        showModal('Erro', error.message);
                    }
                }
            }
        }

        // Salvar dados do usuário no Realtime Database
        async function salvarDadosUsuario(uid) {
            const inputs = document.querySelectorAll('#campos-dinamicos input');
            
            let telefoneIndex = tipoPessoa === 'fisica' ? 2 : 3;
            const telefoneRaw = inputs[telefoneIndex]?.value || '';
            const telefone = telefoneRaw.replace(/\D/g, '');
            
            const dados = {
                email: inputs[inputs.length - 2].value.trim(),
                userType: tipoPessoa === 'fisica' ? 'PF' : 'PJ',
                telefone: telefone,
                createdAt: Date.now(),
                lastAccess: Date.now(),
                photoURL: 'https://i.ibb.co/6J5qZ9K/default-avatar.png',
                mustChangePassword: false
            };
            
            if (tipoPessoa === 'fisica') {
                dados.name = inputs[0].value.trim();
                dados.cpf = inputs[1].value.replace(/\D/g, '');
                dados.cep = inputs[3].value.replace(/\D/g, '');
                dados.logradouro = document.getElementById('cep-rua').value;
                dados.numero = document.getElementById('cep-num').value;
                dados.complemento = inputs[6]?.value || '';
                dados.bairro = document.getElementById('cep-bairro').value;
                dados.cidade = document.getElementById('cep-cidade').value;
                dados.uf = document.getElementById('cep-estado').value;
            } else {
                dados.cnpj = document.getElementById('input-cnpj').value.replace(/\D/g, '');
                dados.inscricao_estadual = inputs[1].value.trim();
                dados.name = document.getElementById('empresa-nome').value;
                dados.cep = document.getElementById('empresa-cep').value.replace(/\D/g, '');
                dados.logradouro = document.getElementById('empresa-logradouro').value;
                dados.numero = document.getElementById('empresa-numero').value;
                dados.complemento = inputs[6]?.value || '';
                dados.bairro = document.getElementById('empresa-bairro').value;
                dados.cidade = document.getElementById('empresa-cidade').value;
                dados.uf = document.getElementById('empresa-uf').value;
            }
            
            await database.ref(`users/${uid}`).update(dados);
        }

        function abrirTermos(event) {
            event.preventDefault();
            showModal('Termo de Privacidade', 'Os seus dados estão protegidos e seguros conosco. Nós coletamos apenas as informações necessárias para criar sua conta e garantir a segurança do sistema.');
        }

        // Inicialização
        renderizarCamposLogin();
    </script>
</body>
